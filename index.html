const fmtDate = d => { if(!d) return ""; const [y,m,dd]=d.split("-"); return `${dd}/${m}/${y}`; };
const fmtTime = t => { if(!t) return ""; const [h,m]=t.split(":"); const hh=parseInt(h); return `${hh>12?hh-12:hh||12}:${m} ${hh>=12?"PM":"AM"}`; };
const calcHours = (s,e) => { if(!s||!e) return 0; const [sh,sm]=s.split(":").map(Number); const [eh,em]=e.split(":").map(Number); const d=(eh*60+em)-(sh*60+sm); return d>0?Math.round(d/60*100)/100:0; };
const weekKey = d => { const dt=new Date(d+"T12:00:00"); const day=dt.getDay(); const mon=new Date(dt); mon.setDate(dt.getDate()-(day===0?6:day-1)); return mon.toISOString().slice(0,10); };
const weekLabel = k => { const s=new Date(k+"T12:00:00"),e=new Date(s); e.setDate(s.getDate()+6); return `${s.getDate()} ${s.toLocaleString("es",{month:"short"})} - ${e.getDate()} ${e.toLocaleString("es",{month:"short",year:"numeric"})}`; };

// Convierte timestamp ISO a HH:MM (hora local)
const isoToTime = iso => {
  if (!iso) return "";
  const d = new Date(iso);
  const h = String(d.getHours()).padStart(2,"0");
  const m = String(d.getMinutes()).padStart(2,"0");
  return `${h}:${m}`;
};

// Renderiza fecha + horas, sin mostrar undefined si faltan start_time/end_time
const fmtDateEntry = (e) => {
const hasTime = e.start_time && e.end_time && e.start_time !== "undefined" && e.end_time !== "undefined";
  if (hasTime) {
    return `${fmtDate(e.date)} · ${fmtTime(e.start_time)}–${fmtTime(e.end_time)} · ${e.hours}h`;
  } else {
    return `${fmtDate(e.date)} · ${e.hours}h`;
  }
};

// Formatea segundos a HH:MM:SS
const fmtElapsed = secs => {
  const h = Math.floor(secs/3600);
  const m = Math.floor((secs%3600)/60);
  const s = secs%60;
  return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
};

function App() {
  const [entries,setEntries] = useState([]);
  const [clients,setClients] = useState(SS_CLIENTS_DEFAULT);
  const [archives,setArchives] = useState([]);
  const [tab,setTab] = useState(0);
  const [timer,setTimer] = useState(null);
  const [eForm,setEForm] = useState({client_id:"",date:today(),start_time:"",end_time:"",hours:0});
  const [cForm,setCForm] = useState({name:"",address:"",notes:"",type:"Residencial",rate:35,currency:"AUD",duracion_estimada_horas:2});
  const [cEdit,setCEdit] = useState(null);
  const [eEdit,setEEdit] = useState(null);

  useEffect(() => {
    (async () => {
      try {
        const {data:ents} = await sb.from('entries').select('*');
        const {data:cls} = await sb.from('clients').select('*');
        const {data:arcs} = await sb.from('archives').select('*');
        if (ents) setEntries(ents);
        if (cls) setClients(cls);
        if (arcs) {
          let loaded = arcs;
          const existingIds = new Set(loaded.map(a=>a.id));
          const missing = HISTORICAL_ARCHIVES.filter(a=>!existingIds.has(a.id));
          if (missing.length>0) {
            loaded = [...loaded,...missing];
            for (const arc of missing) {
              await sb.from('archives').insert({id:arc.id,label:arc.label,entries:arc.entries,archived_at:new Date().toISOString()}).then();
            }
          }
          setArchives(loaded);
        } else {
          setArchives(HISTORICAL_ARCHIVES);
        }
      } catch(err) { console.log('DB init:', err); setArchives(HISTORICAL_ARCHIVES); }
    })();
  }, []);

  useEffect(() => {
    let iv;
    if (timer) {
      iv = setInterval(() => {
        const [h,m] = timer.split(":");
        let total = parseInt(h)*3600 + parseInt(m)*60;
        total = (total+1) % 86400;
        const nh = String(Math.floor(total/3600)).padStart(2,"0");
        const nm = String(Math.floor((total%3600)/60)).padStart(2,"0");
        setTimer(`${nh}:${nm}`);
      }, 1000);
    }
    return () => clearInterval(iv);
  }, [timer]);

  const saveEntry = async () => {
    if (!eForm.client_id) return;
    const h = eForm.hours || calcHours(eForm.start_time, eForm.end_time);
    const c = clients.find(x=>x.id===eForm.client_id);
    const amt = Math.round(h * (c?.rate||35) * 100) / 100;
    const e = {id:uid(),client_id:eForm.client_id,date:eForm.date,start_time:eForm.start_time||null,end_time:eForm.end_time||null,hours:h,total_amount:amt,currency:c?.currency||"AUD",service_type:"General Cleaning",edited_by_user:false};
    const ne = eEdit ? entries.map(x=>x.id===eEdit.id?e:x) : [e,...entries];
    setEntries(ne);
    try { await sb.from('entries').upsert([e]); } catch(err) { console.log('Save error:', err); }
    setEForm({client_id:"",date:today(),start_time:"",end_time:"",hours:0});
    setEEdit(null);
  };

  const editEntry = (e) => {
    setEEdit(e);
    setEForm({client_id:e.client_id,date:e.date,start_time:e.start_time||"",end_time:e.end_time||"",hours:e.hours});
    setTab(0);
  };

  const deleteEntry = async (id) => {
    if (confirm("¿Eliminar este registro?")) {
      setEntries(entries.filter(e=>e.id!==id));
      try { await sb.from('entries').delete().eq('id',id); } catch(err) { console.log('Delete error:', err); }
    }
  };

  const saveClient = async () => {
    if (!cForm.name) return;
    const c = cEdit || {id:uid()};
    const nc = {...c,...cForm};
    const ncl = cEdit ? clients.map(x=>x.id===cEdit.id?nc:x) : [nc,...clients];
    setClients(ncl);
    try { await sb.from('clients').upsert([nc]); } catch(err) { console.log('Save client error:', err); }
    setCForm({name:"",address:"",notes:"",type:"Residencial",rate:35,currency:"AUD",duracion_estimada_horas:2});
    setCEdit(null);
  };

  const editClient = (c) => {
    setCEdit(c);
    setCForm({name:c.name,address:c.address,notes:c.notes||"",type:c.type,rate:c.rate,currency:c.currency||"AUD",duracion_estimada_horas:c.duracion_estimada_horas||2});
  };

  const deleteClient = async (id) => {
    if (confirm("¿Eliminar este cliente?")) {
      setClients(clients.filter(c=>c.id!==id));
      try { await sb.from('clients').delete().eq('id',id); } catch(err) { console.log('Delete client error:', err); }
    }
  };

  const archiveWeek = async (k) => {
    const we = entries.filter(e=>weekKey(e.date)===k);
    if (we.length===0) return;
    const lbl = weekLabel(k);
    const arc = {id:`arc_${uid()}`,label:lbl,entries:we,archived_at:new Date().toISOString()};
    setArchives([arc,...archives]);
    setEntries(entries.filter(e=>!we.find(x=>x.id===e.id)));
    try { 
      await sb.from('archives').insert([arc]);
      for (const e of we) await sb.from('entries').delete().eq('id',e.id);
    } catch(err) { console.log('Archive error:', err); }
  };

  const exportXLSX = (ents,label) => {
    const rows = ents.map(e=>{const c=clients.find(x=>x.id===e.client_id);return [c?.name||"?",e.date,e.hours,c?.rate||0,e.total_amount,e.currency];});
    const ws = XLSX.utils.aoa_to_sheet([["Cliente","Fecha","Horas","Tarifa","Total",label],...rows]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"Registros");
    XLSX.writeFile(wb,`${label}.xlsx`);
  };

  const weeks = useMemo(() => {
    const m = {};
    entries.forEach(e=>{const k=weekKey(e.date);if(!m[k])m[k]=[];m[k].push(e);});
    return Object.entries(m).sort((a,b)=>b[0].localeCompare(a[0]));
  }, [entries]);

  const s = {
    sec:{maxWidth:800,margin:"0 auto",padding:16},
    card:{background:C.card,borderRadius:12,padding:16,marginBottom:16,border:`1px solid ${C.border}`},
    btn:{background:"#6c63ff",color:"#fff",border:"none",borderRadius:8,padding:"12px 16px",fontWeight:600,fontSize:14,cursor:"pointer",width:"100%"},
    btnS:{background:C.bg,color:C.accentBright,border:`1px solid ${C.border}`,borderRadius:6,padding:"6px 12px",cursor:"pointer",fontSize:12,fontWeight:600},
    inp:{background:C.bg,color:C.textPrimary,border:`1px solid ${C.border}`,borderRadius:6,padding:"8px 10px",fontSize:14,fontFamily:"inherit",width:"100%"},
    sel:{background:C.bg,color:C.textPrimary,border:`1px solid ${C.border}`,borderRadius:6,padding:"8px 10px",fontSize:14,fontFamily:"inherit",width:"100%"},
    lbl:{display:"block",fontSize:12,fontWeight:600,color:C.textMuted,marginBottom:6},
    row:{display:"flex",gap:12},
    tabBar:{display:"flex",gap:0,borderTop:`1px solid ${C.border}`,position:"sticky",bottom:0,background:C.bg},
    tabBtn:(active)=>({flex:1,padding:12,border:"none",background:active?C.card:C.bg,color:active?C.accentBright:C.textMuted,cursor:"pointer",fontWeight:600,fontSize:12,borderTop:active?`3px solid ${C.accentBright}`:"none"})
  };

  return (
    <div style={{background:C.bg,minHeight:"100vh",paddingBottom:60}}>
      <div style={{background:C.card,padding:16,borderBottom:`1px solid ${C.border}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div><div style={{fontSize:18,fontWeight:700}}>SS Time Tracker</div><div style={{fontSize:12,color:C.textMuted}}>Super Cleaning Services</div></div>
        <div style={{fontSize:12,color:C.textMuted}}>Royman</div>
      </div>

      {tab===0&&<div style={{...s.sec,paddingTop:16}}>
        <div style={s.card}>
          <div style={{fontWeight:700,fontSize:15,marginBottom:14,color:C.accentBright}}>{eEdit?"✏️ Editar":"📝 Nuevo registro"}</div>
          <label style={s.lbl}>Cliente</label>
          <select style={{...s.sel,marginBottom:10}} value={eForm.client_id} onChange={e=>setEForm(f=>({...f,client_id:e.target.value}))}>
            <option value="">Selecciona cliente</option>
            {clients.map(c=><option key={c.id} value={c.id}>{c.name} ({c.currency} ${c.rate}/h)</option>)}
          </select>
          <label style={s.lbl}>Fecha</label>
          <input style={{...s.inp,marginBottom:10}} type="date" value={eForm.date} onChange={e=>setEForm(f=>({...f,date:e.target.value}))}/>
          <div style={{...s.row,marginBottom:10}}>
            <div><label style={s.lbl}>Inicio</label><input style={s.inp} type="time" value={eForm.start_time} onChange={e=>setEForm(f=>({...f,start_time:e.target.value}))}/></div>
            <div><label style={s.lbl}>Fin</label><input style={s.inp} type="time" value={eForm.end_time} onChange={e=>setEForm(f=>({...f,end_time:e.target.value}))}/></div>
          </div>
          <label style={s.lbl}>Horas (manual si es necesario)</label>
          <input style={{...s.inp,marginBottom:14}} type="number" step="0.25" value={eForm.hours} onChange={e=>setEForm(f=>({...f,hours:parseFloat(e.target.value)||0}))}/>
          <button style={s.btn} onClick={saveEntry}>{eEdit?"💾 Actualizar":"✅ Registrar"}</button>
          {eEdit&&<button style={{...s.btnS,width:"100%",marginTop:8}} onClick={()=>{setEEdit(null);setEForm({client_id:"",date:today(),start_time:"",end_time:"",hours:0});}}>Cancelar</button>}
        </div>
        
        {/* Lista de registros recientes */}
        {entries.length>0&&<div style={s.card}>
          <div style={{fontWeight:700,fontSize:14,marginBottom:12,color:C.textMuted}}>Registros ({entries.length})</div>
          {entries.slice(0,20).map(e=>{const c=clients.find(x=>x.id===e.client_id);return(
            <div key={e.id} style={{borderBottom:`1px solid ${C.border}`,paddingBottom:10,marginBottom:10}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                <div>
                  <div style={{fontWeight:600,fontSize:14}}>
                    {c?.name||"?"}
                    {e.edited_by_user && <span style={{fontSize:10,color:C.warning,marginLeft:6,fontWeight:700}}>✎ EDITADO</span>}
                  </div>
                  <div style={{fontSize:12,color:C.textMuted}}>{fmtDateEntry(e)}</div>
                  {e.edited_by_user && e.original_hours && e.original_hours !== e.hours && (
                    <div style={{fontSize:10,color:C.warning,marginTop:2}}>Original: {e.original_hours}h → Ajustado: {e.hours}h</div>
                  )}
                </div>
                <div style={{textAlign:"right"}}><div style={{fontWeight:700,color:C.green}}>${e.total_amount}</div><div style={{display:"flex",gap:6,marginTop:4}}><button onClick={()=>editEntry(e)} style={{...s.btnS,padding:"4px 10px",fontSize:12}}>✏️</button><button onClick={()=>deleteEntry(e.id)} style={{...s.btnS,padding:"4px 10px",fontSize:12,color:"#ff6060"}}>🗑️</button></div></div>
              </div>
            </div>
          );})}
        </div>}
      </div>}

      {tab===1&&<div style={{...s.sec,paddingTop:16}}>
        <div style={s.card}>
          <div style={{fontWeight:700,fontSize:15,marginBottom:14,color:C.accentBright}}>{cEdit?"✏️ Editar":"➕ Nuevo cliente"}</div>
          <label style={s.lbl}>Nombre</label><input style={{...s.inp,marginBottom:10}} value={cForm.name} onChange={e=>setCForm(f=>({...f,name:e.target.value}))} placeholder="Nombre"/>
          <label style={s.lbl}>Direccion</label><input style={{...s.inp,marginBottom:10}} value={cForm.address} onChange={e=>setCForm(f=>({...f,address:e.target.value}))} placeholder="Direccion"/>
          <label style={s.lbl}>Notas del servicio</label><input style={{...s.inp,marginBottom:10}} value={cForm.notes} onChange={e=>setCForm(f=>({...f,notes:e.target.value}))} placeholder="Ej: Tiene perro, 3 habitaciones..."/>
          <div style={{...s.row,marginBottom:10}}>
            <div><label style={s.lbl}>Tipo</label><select style={s.sel} value={cForm.type} onChange={e=>setCForm(f=>({...f,type:e.target.value}))}><option>Residencial</option><option>Comercial</option></select></div>
            <div><label style={s.lbl}>Moneda</label><select style={s.sel} value={cForm.currency} onChange={e=>setCForm(f=>({...f,currency:e.target.value}))}><option>AUD</option><option>USD</option><option>MXN</option></select></div>
          </div>
          <div style={{...s.row,marginBottom:14}}>
            <div><label style={s.lbl}>Tarifa/hora</label><input style={s.inp} type="number" value={cForm.rate} onChange={e=>setCForm(f=>({...f,rate:e.target.value}))}/></div>
            <div>
              <label style={s.lbl}>Duración (h)</label>
              <select style={s.sel} value={cForm.duracion_estimada_horas} onChange={e=>setCForm(f=>({...f,duracion_estimada_horas:e.target.value}))}>
                <option value="1">1 hora</option>
                <option value="2">2 horas</option>
                <option value="3">3 horas</option>
                <option value="4">4 horas</option>
                <option value="5">5 horas</option>
                <option value="6">6 horas</option>
                <option value="8">8 horas</option>
              </select>
            </div>
          </div>
          <button style={s.btn} onClick={saveClient}>{cEdit?"💾 Actualizar":"✅ Agregar"}</button>
          {cEdit&&<button style={{...s.btnS,width:"100%",marginTop:8}} onClick={()=>{setCEdit(null);setCForm({name:"",address:"",type:"Residencial",rate:35,currency:"AUD",notes:"",duracion_estimada_horas:1});}}>Cancelar</button>}
        </div>
        {[...clients].sort((a,b)=>a.name.localeCompare(b.name)).map(c=>(
          <div key={c.id} style={s.card}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div style={{flex:1}}>
                <div style={{fontWeight:600,fontSize:14}}>{c.name}</div>
                <div style={{fontSize:12,color:C.textMuted,marginTop:2}}>{c.address}</div>
                {c.notes&&<div style={{fontSize:11,color:C.accentBright,marginTop:4}}>📋 {c.notes}</div>}
                <div style={{marginTop:4,fontSize:11,color:C.textMuted}}>{c.type} · {c.currency||"AUD"} ${c.rate}/h · ⏱ {c.duracion_estimada_horas||1}h</div>
              </div>
              <div style={{display:"flex",gap:6}}><button onClick={()=>editClient(c)} style={{...s.btnS,padding:"6px 12px"}}>✏️</button><button onClick={()=>deleteClient(c.id)} style={{...s.btnS,padding:"6px 12px",color:"#ff6060"}}>🗑️</button></div>
            </div>
          </div>
        ))}
      </div>}

      {tab===2&&<div style={{...s.sec,paddingTop:16}}>
        {weeks.length===0&&<div style={{textAlign:"center",padding:40,color:C.textMuted}}>No hay registros aun</div>}
        {weeks.map(([key,wEntries])=>{
          const totals={};wEntries.forEach(e=>{const cur=e.currency||"AUD";totals[cur]=(totals[cur]||0)+e.total_amount;});
          return(<div key={key} style={s.card}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}><div style={{fontWeight:700,fontSize:14}}>{weekLabel(key)}</div><button onClick={()=>exportXLSX(wEntries,weekLabel(key))} style={{...s.btnS,padding:"6px 12px",fontSize:12}}>📊 Excel</button></div>
            {wEntries.sort((a,b)=>b.date.localeCompare(a.date)).map(e=>{const c=clients.find(x=>x.id===e.client_id);return(<div key={e.id} style={{borderBottom:`1px solid ${C.border}`,paddingBottom:8,marginBottom:8,fontSize:13}}><div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontWeight:600}}>{c?.name||"?"} {e.edited_by_user&&<span style={{fontSize:9,color:C.warning}}>✎</span>}</span><span style={{color:C.green,fontWeight:700}}>${e.total_amount}</span></div><div style={{color:C.textMuted}}>{fmtDateEntry(e)}</div></div>);})}
            <div style={{borderTop:`1px solid ${C.border}`,paddingTop:8}}>{Object.entries(totals).map(([cur,tot])=><div key={cur} style={{display:"flex",justifyContent:"space-between",fontWeight:700,fontSize:15}}><span>Total {cur}</span><span style={{color:C.accentBright}}>${Math.round(tot*100)/100}</span></div>)}</div>
          </div>);
        })}
      </div>}

      {tab===3&&<div style={{...s.sec,paddingTop:16}}>
        {archives.length===0&&<div style={{textAlign:"center",padding:40,color:C.textMuted}}>No hay semanas archivadas</div>}
        {archives.map(arc=>{
          const ents=arc.entries||[];const totals={};ents.forEach(e=>{const cur=e.currency||"AUD";totals[cur]=(totals[cur]||0)+(e.total_amount||0);});
          return(<div key={arc.id} style={s.card}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}><div style={{fontWeight:700,fontSize:14}}>{arc.label}</div><button onClick={()=>exportXLSX(ents,arc.label)} style={{...s.btnS,padding:"6px 12px",fontSize:12}}>📊 Excel</button></div>
            {ents.map((e,i)=>{const c=clients.find(x=>x.id===e.client_id);return(<div key={i} style={{borderBottom:`1px solid ${C.border}`,paddingBottom:8,marginBottom:8,fontSize:13}}><div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontWeight:600}}>{c?.name||"?"}</span><span style={{color:C.green,fontWeight:700}}>${e.total_amount}</span></div><div style={{color:C.textMuted}}>{fmtDateEntry(e)}</div></div>);})}
            <div style={{borderTop:`1px solid ${C.border}`,paddingTop:8}}>{Object.entries(totals).map(([cur,tot])=><div key={cur} style={{display:"flex",justifyContent:"space-between",fontWeight:700,fontSize:15}}><span>Total {cur}</span><span style={{color:C.accentBright}}>${Math.round(tot*100)/100}</span></div>)}</div>
          </div>);
        })}
      </div>}

      <div style={s.tabBar}>
        {TABS.map((t,i)=><button key={t} style={s.tabBtn(tab===i)} onClick={()=>setTab(i)}><span style={{fontSize:18}}>{ICONS[i]}</span><span>{t}</span></button>)}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
