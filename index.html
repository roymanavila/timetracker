const fmtDate = d => {
  if(!d) return "";
  if (d.includes("/")) return d;
  if (d.includes("-")) {
    const [y,m,dd] = d.split("-");
    return `${dd}/${m}/${y}`;
  }
  return d;
};

const fmtTime = t => { if(!t) return ""; const [h,m]=t.split(":"); const hh=parseInt(h); return `${hh>12?hh-12:hh||12}:${m} ${hh>=12?"PM":"AM"}`; };
const calcHours = (s,e) => { if(!s||!e) return 0; const [sh,sm]=s.split(":").map(Number); const [eh,em]=e.split(":").map(Number); const d=(eh*60+em)-(sh*60+sm); return d>0?Math.round(d/60*100)/100:0; };
const weekKey = d => { const dt=new Date(d+"T12:00:00"); const day=dt.getDay(); const mon=new Date(dt); mon.setDate(dt.getDate()-(day===0?6:day-1)); return mon.toISOString().slice(0,10); };
const weekLabel = k => { const s=new Date(k+"T12:00:00"),e=new Date(s); e.setDate(s.getDate()+6); return `${s.getDate()} ${s.toLocaleString("es",{month:"short"})} - ${e.getDate()} ${e.toLocaleString("es",{month:"short",year:"numeric"})}`; };

const isoToTime = iso => {
  if (!iso) return "";
  const d = new Date(iso);
  const h = String(d.getHours()).padStart(2,"0");
  const m = String(d.getMinutes()).padStart(2,"0");
  return `${h}:${m}`;
};

const fmtDateEntry = (e) => {
  const hasTime = e.start_time && e.end_time &&
                  e.start_time !== "undefined" && e.end_time !== "undefined" &&
                  e.start_time !== null && e.end_time !== null;
  if (hasTime) {
    return `${fmtDate(e.date)} · ${fmtTime(e.start_time)}–${fmtTime(e.end_time)} · ${e.hours}h`;
  } else {
    return `${fmtDate(e.date)} · ${e.hours}h`;
  }
};

const fmtElapsed = secs => {
  const h = Math.floor(secs/3600);
  const m = Math.floor((secs%3600)/60);
  const s = Math.floor(secs%60);
  return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
};

    row:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10},
    sec:{padding:"0 16px"},
    modal:{position:"fixed",inset:0,background:"rgba(42,37,32,0.45)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200,padding:20},
    mCard:{background:C.card,borderRadius:14,padding:24,width:"100%",maxWidth:340,border:`0.5px solid ${C.border}`},
    modeToggle:{display:"inline-flex",gap:0,marginBottom:18,background:C.cardSoft,borderRadius:8,padding:3,border:`0.5px solid ${C.border}`},
    modeBtn:a=>({padding:"7px 16px",background:a?C.card:"transparent",color:a?C.text:C.textMuted,border:"none",borderRadius:6,fontFamily:"inherit",fontWeight:a?500:400,fontSize:13,cursor:"pointer",boxShadow:a?"0 1px 2px rgba(0,0,0,0.04)":"none"}),
    sectionLabel:{fontSize:11,fontWeight:500,letterSpacing:"0.04em",color:C.textMuted,textTransform:"uppercase",marginBottom:14},
  };

  if(loading) return <div style={{...s.app,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16}}><div style={s.logo}>SS</div><div style={{color:C.textMuted,fontSize:13}}>Cargando...</div></div>;

  return (
    <div style={s.app}>
      {toast&&<div style={s.toast(toast.type)}>{toast.msg}</div>}

      {showModal&&<div style={s.modal}><div style={s.mCard}>
        <div style={{display:"flex",justifyContent:"center",marginBottom:14}}><div style={s.logo}>SS</div></div>
        <div style={{fontWeight:500,fontSize:16,textAlign:"center",marginBottom:4,color:C.text}}>Bienvenido</div>
        <div style={{fontSize:13,color:C.textMuted,textAlign:"center",marginBottom:18}}>¿Cómo te llamas?</div>
        <input style={{...s.inp,marginBottom:14}} placeholder="Tu nombre" value={tempName} onChange={e=>setTempName(e.target.value)}/>
        <button style={s.btn} onClick={()=>{if(!tempName.trim())return;localStorage.setItem("ssc_username",tempName.trim());setUserName(tempName.trim());setShowModal(false);}}>Entrar</button>
      </div></div>}

      {showSettings&&<div style={s.modal} onClick={()=>setShowSettings(false)}><div style={s.mCard} onClick={e=>e.stopPropagation()}>
        <div style={{fontWeight:500,fontSize:16,marginBottom:4,color:C.text}}>Ajustes</div>
        <div style={{fontSize:13,color:C.textMuted,marginBottom:18}}>Configuración del usuario</div>
        <label style={s.lbl}>Nombre de usuario</label>
        <input style={{...s.inp,marginBottom:14}} placeholder="Tu nombre" value={tempName} onChange={e=>setTempName(e.target.value)}/>
        <button style={s.btn} onClick={()=>{if(!tempName.trim())return;localStorage.setItem("ssc_username",tempName.trim());setUserName(tempName.trim());setShowSettings(false);showToast("Nombre actualizado");}}>Guardar</button>
        <button style={{...s.btnS,width:"100%",marginTop:8}} onClick={()=>setShowSettings(false)}>Cancelar</button>
      </div></div>}

      <div style={s.header}>
        <div style={s.logo}>SS</div>
        <div style={{flex:1}}>
          <div style={{fontWeight:500,fontSize:15,color:C.text}}>SS Time Tracker</div>
          <div style={{fontSize:11,color:C.textMuted}}>Super Cleaning Services</div>
        </div>
        <div style={{display:"flex",gap:10,alignItems:"center"}}>
          <span style={{fontSize:13,color:C.textMuted}}>{userName}</span>
          <button onClick={()=>{setTempName(userName);setShowSettings(true);}} style={s.iconBtn} title="Ajustes">⚙</button>
        </div>
      </div>

      {runningTimer && tab !== 0 && (
        <div style={{...s.sec,paddingTop:12}}>
          <div onClick={()=>setTab(0)} style={{background:isOvertime?C.warning:C.brand,borderRadius:10,padding:"12px 16px",display:"flex",alignItems:"center",gap:12,cursor:"pointer"}} className="pulse">
            <span style={{fontSize:18}}>⏱</span>
            <div style={{flex:1}}>
              <div style={{fontWeight:500,fontSize:14,color:"#fff"}}>{runningTimer.clientName} en curso</div>
              <div style={{fontSize:12,color:"rgba(255,255,255,0.85)"}}>{fmtElapsed(elapsedSecs)} {isOvertime && "(tiempo excedido)"}</div>
            </div>
            <span style={{color:"#fff",fontSize:18}}>›</span>
          </div>
        </div>
      )}

      {tab===0&&<div style={{...s.sec,paddingTop:18}}>
        {runningTimer && (
          <div style={{...s.card,border:`1px solid ${isOvertime?C.warning:C.brand}`}}>
            <div style={{textAlign:"center",marginBottom:12}}>
              <div style={s.sectionLabel}>Servicio en curso</div>
              <div style={{fontSize:18,fontWeight:500,color:C.text,marginTop:2}}>{runningTimer.clientName}</div>
              {timerClient?.address && <div style={{fontSize:12,color:C.textMuted,marginTop:2}}>{timerClient.address}</div>}
            </div>
            <div style={{textAlign:"center",padding:"22px 0",background:C.cardSoft,borderRadius:10,marginBottom:14,border:`0.5px solid ${C.border}`}}>
              <div className={isOvertime?"":"pulse"} style={{fontSize:42,fontWeight:500,fontFamily:"monospace",color:isOvertime?C.warning:C.text,letterSpacing:2}}>
                {fmtElapsed(elapsedSecs)}
              </div>
              <div style={{fontSize:12,color:C.textMuted,marginTop:6}}>
                {isOvertime ? (
                  <span style={{color:C.warning,fontWeight:500}}>Excedido por {fmtElapsed(elapsedSecs - targetSecs)}</span>
                ) : (
                  <span>Quedan {fmtElapsed(remainingSecs)} de {runningTimer.duracionEstimadaHoras}h estimadas</span>
                )}
              </div>
            </div>
            {timerClient && (
              <div style={{background:C.cardSoft,borderRadius:8,padding:"10px 12px",marginBottom:10,fontSize:13,color:C.textMuted,border:`0.5px solid ${C.border}`}}>
                Tarifa: <b style={{color:C.text}}>${timerClient.rate}/h {timerClient.currency}</b> · Inicio: <b style={{color:C.text}}>{isoToTime(runningTimer.checkInAt)}</b>
              </div>
            )}
            {timerClient?.notes && (
              <div style={{background:C.brandSoft,border:`0.5px solid ${C.brand}`,borderRadius:8,padding:"10px 12px",marginBottom:14,fontSize:12,color:C.text}}>
                <b>Notas del cliente:</b> {timerClient.notes}
              </div>
            )}
            <button onClick={stopTimer} style={s.btnStop}>Finalizar servicio</button>
            <button onClick={cancelTimer} style={{...s.btnS,width:"100%",marginTop:8,color:C.danger}}>Cancelar (sin guardar)</button>
          </div>
        )}

        {!runningTimer && (
          <>
            {!editId && (
              <div style={s.modeToggle}>
                <button style={s.modeBtn(registerMode==="timer")} onClick={()=>setRegisterMode("timer")}>Cronómetro</button>
                <button style={s.modeBtn(registerMode==="manual")} onClick={()=>setRegisterMode("manual")}>Manual</button>
              </div>
            )}

            {!editId && registerMode==="timer" && (
              <div style={s.card}>
                <div style={s.sectionLabel}>Iniciar servicio</div>
                <label style={s.lbl}>Cliente</label>
                <select style={{...s.sel,marginBottom:14}} value={timerClientId} onChange={e=>setTimerClientId(e.target.value)}>
                  <option value="">Seleccionar cliente…</option>
                  {[...clients].sort((a,b)=>a.name.localeCompare(b.name)).map(c=><option key={c.id} value={c.id}>{c.name} — ${c.rate}/h ({c.duracion_estimada_horas||1}h)</option>)}
                </select>
                {timerClientId && (() => {
                  const sel = clients.find(c => c.id === timerClientId);
                  return sel?.notes ? (
                    <div style={{background:C.brandSoft,border:`0.5px solid ${C.brand}`,borderRadius:8,padding:"10px 12px",marginBottom:14,fontSize:12,color:C.text}}>
                      <b>Notas:</b> {sel.notes}
                    </div>
                  ) : null;
                })()}
                <label style={s.lbl}>Notas iniciales <span style={{color:C.textHint}}>(opcional)</span></label>
                <input style={{...s.inp,marginBottom:18}} placeholder="Algo a tener en cuenta…" value={timerNotes} onChange={e=>setTimerNotes(e.target.value)}/>
                <button style={s.btnPrimary} onClick={startTimer}>Iniciar servicio</button>
                <div style={{textAlign:"center",fontSize:11,color:C.textMuted,marginTop:10}}>
                  El cronómetro arrancará automáticamente
                </div>
              </div>
            )}

            {(registerMode==="manual" || editId) && (
              <div style={s.card}>
                <div style={s.sectionLabel}>{editId?"Editar registro":"Registro manual"}</div>
                {editId && entries.find(e=>e.id===editId)?.edited_by_user && (
                  <div style={{background:C.warningSoft,border:`0.5px solid ${C.warning}`,borderRadius:8,padding:"8px 12px",marginBottom:12,fontSize:12,color:C.warning}}>
                    Este registro ya fue editado anteriormente
                  </div>
                )}
                <label style={s.lbl}>Cliente</label>
                <select style={{...s.sel,marginBottom:12}} value={form.clientId} onChange={e=>setForm(f=>({...f,clientId:e.target.value}))}>
                  <option value="">Seleccionar cliente…</option>
                  {[...clients].sort((a,b)=>a.name.localeCompare(b.name)).map(c=><option key={c.id} value={c.id}>{c.name} — ${c.rate}/h</option>)}
                </select>
                {client?.notes&&<div style={{background:C.brandSoft,border:`0.5px solid ${C.brand}`,borderRadius:8,padding:"10px 12px",marginBottom:12,fontSize:12,color:C.text}}><b>Notas:</b> {client.notes}</div>}
                <label style={s.lbl}>Fecha</label>
                <input style={{...s.inp,marginBottom:12}} type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/>
                <div style={{...s.row,marginBottom:12}}>
                  <div><label style={s.lbl}>Inicio</label><input style={s.inp} type="time" value={form.startTime} onChange={e=>setForm(f=>({...f,startTime:e.target.value}))}/></div>
                  <div><label style={s.lbl}>Fin</label><input style={s.inp} type="time" value={form.endTime} onChange={e=>setForm(f=>({...f,endTime:e.target.value}))}/></div>
                </div>
                {hours>0&&<div style={{background:C.cardSoft,borderRadius:8,padding:"10px 12px",marginBottom:12,fontSize:13,color:C.textMuted,border:`0.5px solid ${C.border}`}}><b style={{color:C.text}}>{hours}h</b> · Base: <b style={{color:C.text}}>${baseAmt} {client?.currency||"AUD"}</b></div>}
                <label style={s.lbl}>Tipo de servicio</label>
                <select style={{...s.sel,marginBottom:12}} value={form.serviceType} onChange={e=>setForm(f=>({...f,serviceType:e.target.value}))}>{SVC.map(t=><option key={t}>{t}</option>)}</select>
                <label style={s.lbl}>Notas</label>
                <input style={{...s.inp,marginBottom:14}} placeholder="Observaciones…" value={form.notes} onChange={e=>setForm(f=>({...f,notes:e.target.value}))}/>
                <div style={{fontSize:12,fontWeight:500,color:C.textMuted,marginBottom:8}}>Cargos adicionales</div>
                {form.extras.map(x=><div key={x.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:C.cardSoft,border:`0.5px solid ${C.border}`,borderRadius:8,padding:"8px 12px",marginBottom:6,fontSize:13}}><span style={{color:C.text}}>{x.desc}</span><span style={{color:C.green,fontWeight:500}}>${x.amount} <button onClick={()=>removeExtra(x.id)} style={{background:"none",border:"none",color:C.danger,cursor:"pointer",marginLeft:6}}>×</button></span></div>)}
                <div style={{display:"flex",gap:8,marginBottom:14}}>
                  <input style={{...s.inp,flex:2}} placeholder="Descripción" value={extraDesc} onChange={e=>setExtraDesc(e.target.value)}/>
                  <input style={{...s.inp,flex:1}} placeholder="$" type="number" value={extraAmt} onChange={e=>setExtraAmt(e.target.value)}/>
                  <button onClick={addExtra} style={{...s.btnS,padding:"10px 14px"}}>+</button>
                </div>
                {form.extras.length>0&&<div style={{background:C.cardSoft,borderRadius:8,padding:"10px 12px",marginBottom:12,fontSize:13,color:C.textMuted,border:`0.5px solid ${C.border}`}}>Total: <b style={{color:C.green}}>${totalAmt} {client?.currency||"AUD"}</b></div>}
                <button style={s.btn} onClick={saveEntry}>{editId?"Actualizar":"Guardar registro"}</button>
                {editId&&<button style={{...s.btnS,width:"100%",marginTop:8}} onClick={()=>{setEditId(null);setForm(initForm);setRegisterMode("timer");}}>Cancelar</button>}
              </div>
            )}
          </>
        )}

        {entries.length>0&&<div style={{marginTop:18}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12,padding:"0 4px"}}>
            <div style={{fontSize:14,fontWeight:500,color:C.text}}>Registros <span style={{color:C.textMuted,fontWeight:400}}>· {entries.length}</span></div>
          </div>
          {entries.slice(0,20).map(e=>{const c=clients.find(x=>x.id===e.client_id);return(
            <div key={e.id} style={{background:C.card,border:`0.5px solid ${C.border}`,borderRadius:10,padding:"14px 16px",marginBottom:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                  <div style={{fontWeight:500,fontSize:14,color:C.text}}>{c?.name||"?"}</div>
                  {e.edited_by_user && <span style={{fontSize:10,padding:"2px 7px",borderRadius:4,background:C.editedBg,color:C.edited,fontWeight:400}}>editado</span>}
                </div>
                <div style={{fontSize:12,color:C.textMuted,marginTop:3}}>{fmtDateEntry(e)}</div>
                {e.edited_by_user && e.original_hours && e.original_hours !== e.hours && (
                  <div style={{fontSize:10,color:C.edited,marginTop:2}}>Original: {e.original_hours}h → Ajustado: {e.hours}h</div>
                )}
              </div>
              <div style={{display:"flex",alignItems:"center",gap:12,marginLeft:10}}>
                <div style={{fontSize:15,fontWeight:500,color:C.green}}>${e.total_amount}</div>
                <div style={{display:"flex",gap:4}}>
                  <button onClick={()=>editEntry(e)} style={s.rowIconBtn} title="Editar">✎</button>
                  <button onClick={()=>deleteEntry(e.id)} style={{...s.rowIconBtn,color:C.textHint}} title="Eliminar">×</button>
                </div>
              </div>
            </div>
          );})}
        </div>}
      </div>}

      {tab===1&&<div style={{...s.sec,paddingTop:18}}>
        <div style={s.card}>
          <div style={s.sectionLabel}>{cEdit?"Editar cliente":"Nuevo cliente"}</div>
          <label style={s.lbl}>Nombre</label><input style={{...s.inp,marginBottom:10}} value={cForm.name} onChange={e=>setCForm(f=>({...f,name:e.target.value}))} placeholder="Nombre"/>
          <label style={s.lbl}>Dirección</label><input style={{...s.inp,marginBottom:10}} value={cForm.address} onChange={e=>setCForm(f=>({...f,address:e.target.value}))} placeholder="Dirección"/>
          <label style={s.lbl}>Notas del servicio</label><input style={{...s.inp,marginBottom:10}} value={cForm.notes} onChange={e=>setCForm(f=>({...f,notes:e.target.value}))} placeholder="Ej: Tiene perro, 3 habitaciones…"/>
          <div style={{...s.row,marginBottom:10}}>
            <div><label style={s.lbl}>Tipo</label><select style={s.sel} value={cForm.type} onChange={e=>setCForm(f=>({...f,type:e.target.value}))}><option>Residencial</option><option>Comercial</option></select></div>
            <div><label style={s.lbl}>Moneda</label><select style={s.sel} value={cForm.currency} onChange={e=>setCForm(f=>({...f,currency:e.target.value}))}><option>AUD</option><option>USD</option><option>MXN</option></select></div>
          </div>
          <div style={{...s.row,marginBottom:14}}>
            <div><label style={s.lbl}>Tarifa/hora</label><input style={s.inp} type="number" value={cForm.rate} onChange={e=>setCForm(f=>({...f,rate:e.target.value}))}/></div>
            <div>
              <label style={s.lbl}>Duración (h)</label>
              <select style={s.sel} value={cForm.duracion_estimada_horas} onChange={e=>setCForm(f=>({...f,duracion_estimada_horas:e.target.value}))}>
                <option value="1">1 hora</option>
                <option value="2">2 horas</option>
                <option value="3">3 horas</option>
                <option value="4">4 horas</option>
                <option value="5">5 horas</option>
                <option value="6">6 horas</option>
                <option value="8">8 horas</option>
              </select>
            </div>
          </div>
          <button style={s.btn} onClick={saveClient}>{cEdit?"Actualizar":"Agregar"}</button>
          {cEdit&&<button style={{...s.btnS,width:"100%",marginTop:8}} onClick={()=>{setCEdit(null);setCForm({name:"",address:"",type:"Residencial",rate:35,currency:"AUD",notes:"",duracion_estimada_horas:1});}}>Cancelar</button>}
        </div>
        {[...clients].sort((a,b)=>a.name.localeCompare(b.name)).map(c=>(
          <div key={c.id} style={s.card}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div style={{flex:1}}>
                <div style={{fontWeight:500,fontSize:14,color:C.text}}>{c.name}</div>
                <div style={{fontSize:12,color:C.textMuted,marginTop:2}}>{c.address}</div>
                {c.notes&&<div style={{fontSize:11,color:C.brand,marginTop:4}}>{c.notes}</div>}
                <div style={{marginTop:5,fontSize:11,color:C.textMuted}}>{c.type} · {c.currency||"AUD"} ${c.rate}/h · {c.duracion_estimada_horas||1}h</div>
              </div>
              <div style={{display:"flex",gap:6}}>
                <button onClick={()=>editClient(c)} style={s.rowIconBtn} title="Editar">✎</button>
                <button onClick={()=>deleteClient(c.id)} style={{...s.rowIconBtn,color:C.textHint}} title="Eliminar">×</button>
              </div>
            </div>
          </div>
        ))}
      </div>}

      {tab===2&&<div style={{...s.sec,paddingTop:18}}>
        {weeks.length===0&&<div style={{textAlign:"center",padding:40,color:C.textMuted,fontSize:13}}>No hay registros aún</div>}
        {weeks.map(([key,wEntries])=>{
          const totals={};wEntries.forEach(e=>{const cur=e.currency||"AUD";totals[cur]=(totals[cur]||0)+e.total_amount;});
          return(<div key={key} style={s.card}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}><div style={{fontWeight:500,fontSize:14,color:C.text}}>{weekLabel(key)}</div><button onClick={()=>exportXLSX(wEntries,weekLabel(key))} style={{...s.btnS,padding:"6px 12px",fontSize:12}}>Excel</button></div>
            {wEntries.sort((a,b)=>b.date.localeCompare(a.date)).map(e=>{const c=clients.find(x=>x.id===e.client_id);return(<div key={e.id} style={{borderBottom:`0.5px solid ${C.border}`,paddingBottom:8,marginBottom:8,fontSize:13}}><div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontWeight:500,color:C.text}}>{c?.name||"?"} {e.edited_by_user&&<span style={{fontSize:9,color:C.edited,marginLeft:4}}>editado</span>}</span><span style={{color:C.green,fontWeight:500}}>${e.total_amount}</span></div><div style={{color:C.textMuted,marginTop:2}}>{fmtDateEntry(e)}</div></div>);})}
            <div style={{borderTop:`0.5px solid ${C.border}`,paddingTop:10,marginTop:4}}>{Object.entries(totals).map(([cur,tot])=><div key={cur} style={{display:"flex",justifyContent:"space-between",fontWeight:500,fontSize:15}}><span style={{color:C.text}}>Total {cur}</span><span style={{color:C.brand}}>${Math.round(tot*100)/100}</span></div>)}</div>
          </div>);
        })}
      </div>}

      {tab===3&&<div style={{...s.sec,paddingTop:18}}>
        {archives.length===0&&<div style={{textAlign:"center",padding:40,color:C.textMuted,fontSize:13}}>No hay semanas archivadas</div>}
        {archives.map(arc=>{
          const ents=arc.entries||[];const totals={};ents.forEach(e=>{const cur=e.currency||"AUD";totals[cur]=(totals[cur]||0)+(e.total_amount||0);});
          return(<div key={arc.id} style={s.card}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}><div style={{fontWeight:500,fontSize:14,color:C.text}}>{arc.label}</div><button onClick={()=>exportXLSX(ents,arc.label)} style={{...s.btnS,padding:"6px 12px",fontSize:12}}>Excel</button></div>
            {ents.map((e,i)=>{const c=clients.find(x=>x.id===e.client_id);return(<div key={i} style={{borderBottom:`0.5px solid ${C.border}`,paddingBottom:8,marginBottom:8,fontSize:13}}><div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontWeight:500,color:C.text}}>{c?.name||"?"}</span><span style={{color:C.green,fontWeight:500}}>${e.total_amount}</span></div><div style={{color:C.textMuted,marginTop:2}}>{fmtDateEntry(e)}</div></div>);})}
            <div style={{borderTop:`0.5px solid ${C.border}`,paddingTop:10,marginTop:4}}>{Object.entries(totals).map(([cur,tot])=><div key={cur} style={{display:"flex",justifyContent:"space-between",fontWeight:500,fontSize:15}}><span style={{color:C.text}}>Total {cur}</span><span style={{color:C.brand}}>${Math.round(tot*100)/100}</span></div>)}</div>
          </div>);
        })}
      </div>}

      <div style={s.tabBar}>
        {TABS.map((t,i)=><button key={t} style={s.tabBtn(tab===i)} onClick={()=>setTab(i)}><span style={{fontSize:16}}>{ICONS[i]}</span><span>{t}</span></button>)}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
