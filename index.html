const uid = () => Math.random().toString(36).slice(2,10);
const today = () => new Date().toISOString().slice(0,10);
const fmtDate = d => { if(!d) return ""; const [y,m,dd]=d.split("-"); return `${dd}/${m}/${y}`; };
const fmtTime = t => { if(!t || t === "undefined") return ""; const [h,m]=t.split(":"); const hh=parseInt(h); return `${hh>12?hh-12:hh||12}:${m} ${hh>=12?"PM":"AM"}`; };
const calcHours = (s,e) => { if(!s||!e) return 0; const [sh,sm]=s.split(":").map(Number); const [eh,em]=e.split(":").map(Number); const d=(eh*60+em)-(sh*60+sm); return d>0?Math.round(d/60*100)/100:0; };
const weekKey = d => { const dt=new Date(d+"T12:00:00"); const day=dt.getDay(); const mon=new Date(dt); mon.setDate(dt.getDate()-(day===0?6:day-1)); return mon.toISOString().slice(0,10); };
const weekLabel = k => { const s=new Date(k+"T12:00:00"),e=new Date(s); e.setDate(s.getDate()+6); return `${s.getDate()} ${s.toLocaleString("es",{month:"short"})} - ${e.getDate()} ${e.toLocaleString("es",{month:"short",year:"numeric"})}`; };

// Convierte timestamp ISO a HH:MM (hora local)
const isoToTime = iso => {
  if (!iso) return "";
  const d = new Date(iso);
  const h = String(d.getHours()).padStart(2,"0");
  const m = String(d.getMinutes()).padStart(2,"0");
  return `${h}:${m}`;
};

// Renderiza fecha + horas, sin mostrar undefined si faltan start_time/end_time
const fmtDateEntry = (e) => {
  const hasTime = e.start_time && e.end_time && e.start_time !== "undefined" && e.end_time !== "undefined";
  if (hasTime) {
    return `${fmtDate(e.date)} · ${fmtTime(e.start_time)}–${fmtTime(e.end_time)} · ${e.hours}h`;
  } else {
    return `${fmtDate(e.date)} · ${e.hours}h`;
  }
};

// Formatea segundos a HH:MM:SS
const fmtElapsed = secs => {
  const h = Math.floor(secs/3600);
  const m = Math.floor((secs%3600)/60);
  const s = Math.floor(secs%60);
  return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
};

const C = {bg:"#1a0a0e",card:"#2a1018",border:"#4a1828",accentBright:"#c42040",text:"#f5ede8",textMuted:"#a08070",green:"#80d880",inputBg:"#200c14",warning:"#f5a040"};

const TABS = ["Registrar","Clientes","Facturacion","Archivo"];
const ICONS = ["📋","👥","💰","📦"];

function App() {
  const [clients,setClients]=useState([]);
  const [entries,setEntries]=useState([]);
  const [archives,setArchives]=useState([]);
  const [loading,setLoading]=useState(true);
  const [tab,setTab]=useState(0);
  const [toast,setToast]=useState(null);
  const [userName,setUserName]=useState(()=>localStorage.getItem("ssc_username")||"");
  const [showModal,setShowModal]=useState(false);
  const [tempName,setTempName]=useState("");
  
  // ==== ESTADO DEL CRONÓMETRO ====
  // runningTimer guarda el servicio en curso. Persiste en localStorage.
  const [runningTimer, setRunningTimer] = useState(() => {
    try {
      const saved = localStorage.getItem("ssc_running_timer");
      return saved ? JSON.parse(saved) : null;
    } catch { return null; }
  });
  const [tickNow, setTickNow] = useState(Date.now()); // fuerza re-render cada segundo
  const [timerClientId, setTimerClientId] = useState("");
  const [timerNotes, setTimerNotes] = useState("");
  const [registerMode, setRegisterMode] = useState("timer"); // "timer" o "manual"
  
  // Tick del cronómetro: actualiza cada segundo si hay timer corriendo
  useEffect(() => {
    if (!runningTimer) return;
    const intervalId = setInterval(() => setTickNow(Date.now()), 1000);
    return () => clearInterval(intervalId);
  }, [runningTimer]);
  
  // Guardar runningTimer en localStorage cuando cambie
  useEffect(() => {
    if (runningTimer) {
      localStorage.setItem("ssc_running_timer", JSON.stringify(runningTimer));
    } else {
      localStorage.removeItem("ssc_running_timer");
    }
  }, [runningTimer]);

  const showToast=(msg,type="ok")=>{setToast({msg,type});setTimeout(()=>setToast(null),2800);};

  useEffect(()=>{loadData();},[]);
  useEffect(()=>{if(!userName)setShowModal(true);},[userName]);

  const loadData=async()=>{
    setLoading(true);
    try {
      const [{data:cls},{data:ens},{data:arcs}]=await Promise.all([
        sb.from("clients").select("*").order("name"),
        sb.from("entries").select("*").order("date",{ascending:false}),
        sb.from("archives").select("*").order("id",{ascending:false}),
      ]);
      if(cls?.length) setClients(cls);
      else { const {data:ins}=await sb.from("clients").insert(SS_CLIENTS_DEFAULT).select(); setClients(ins||SS_CLIENTS_DEFAULT); }
      setEntries(ens||[]);
      setArchives(arcs||[]);
    } catch(e){showToast("Error conectando","err");}
    setLoading(false);
  };

  const initForm={clientId:"",date:today(),startTime:"",endTime:"",serviceType:SVC[0],notes:"",extras:[]};
  const [form,setForm]=useState(initForm);
  const [extraDesc,setExtraDesc]=useState("");
  const [extraAmt,setExtraAmt]=useState("");
  const [editId,setEditId]=useState(null);

  const hours=calcHours(form.startTime,form.endTime);
  const client=clients.find(c=>c.id===form.clientId);
  const baseAmt=client?Math.round(hours*client.rate*100)/100:0;
  const extrasTotal=form.extras.reduce((s,x)=>s+x.amount,0);
  const totalAmt=Math.round((baseAmt+extrasTotal)*100)/100;

  const addExtra=()=>{if(!extraDesc.trim()||!extraAmt)return;setForm(f=>({...f,extras:[...f.extras,{id:uid(),desc:extraDesc.trim(),amount:parseFloat(extraAmt)}]}));setExtraDesc("");setExtraAmt("");};
  const removeExtra=id=>setForm(f=>({...f,extras:f.extras.filter(x=>x.id!==id)}));

  // ==== FUNCIONES DEL CRONÓMETRO ====
  
  const startTimer = () => {
    if (!timerClientId) {
      showToast("Selecciona un cliente primero", "err");
      return;
    }
    if (runningTimer) {
      showToast("Ya hay un servicio en curso", "err");
      return;
    }
    const cli = clients.find(c => c.id === timerClientId);
    const newTimer = {
      clientId: timerClientId,
      clientName: cli?.name || "?",
      checkInAt: new Date().toISOString(),
      duracionEstimadaHoras: cli?.duracion_estimada_horas || 1,
      notes: timerNotes,
      serviceType: SVC[0]
    };
    setRunningTimer(newTimer);
    setTimerNotes("");
    showToast(`▶️ Servicio iniciado para ${cli?.name}`);
  };
  
  const stopTimer = async () => {
    if (!runningTimer) return;
    if (!confirm(`¿Finalizar el servicio de ${runningTimer.clientName}?`)) return;
    
    const checkInAt = new Date(runningTimer.checkInAt);
    const checkOutAt = new Date();
    const elapsedMs = checkOutAt - checkInAt;
    const realHours = Math.round((elapsedMs / 1000 / 3600) * 100) / 100;
    
    const cli = clients.find(c => c.id === runningTimer.clientId);
    const baseAmount = cli ? Math.round(realHours * cli.rate * 100) / 100 : 0;
    
    const entry = {
      client_id: runningTimer.clientId,
      user_name: userName || "Royman",
      date: checkInAt.toISOString().slice(0,10),
      start_time: isoToTime(runningTimer.checkInAt),
      end_time: isoToTime(checkOutAt.toISOString()),
      hours: realHours,
      service_type: runningTimer.serviceType,
      notes: runningTimer.notes || "",
      extras: [],
      base_amount: baseAmount,
      extras_amount: 0,
      total_amount: baseAmount,
      currency: cli?.currency || "AUD",
      check_in_at: runningTimer.checkInAt,
      check_out_at: checkOutAt.toISOString(),
      is_running: false,
      edited_by_user: false,
      original_hours: realHours
    };
    
    try {
      const { data } = await sb.from("entries").insert(entry).select().single();
      setEntries([data, ...entries]);
      setRunningTimer(null);
      showToast(`✅ Servicio guardado: ${realHours}h`);
    } catch (e) {
      showToast("Error guardando", "err");
      console.error(e);
    }
  };
  
  const cancelTimer = () => {
    if (!confirm("¿Cancelar el servicio en curso? No se guardará nada.")) return;
    setRunningTimer(null);
    showToast("Cronómetro cancelado");
  };

  const saveEntry=async()=>{
    if(!form.clientId||!form.date||!form.startTime||!form.endTime){showToast("Completa todos los campos","err");return;}
    if(hours<=0){showToast("Hora fin debe ser mayor que inicio","err");return;}
    
    const isEdit = !!editId;
    const originalEntry = isEdit ? entries.find(e => e.id === editId) : null;
    
    // Detecta si las horas/tiempos cambiaron respecto al original
    const horasFueronEditadas = isEdit && originalEntry && (
      originalEntry.start_time !== form.startTime ||
      originalEntry.end_time !== form.endTime ||
      Math.abs((originalEntry.hours || 0) - hours) > 0.01
    );
    
    const entry={
      client_id:form.clientId,
      user_name:userName||"Royman",
      date:form.date,
      start_time:form.startTime,
      end_time:form.endTime,
      hours,
      service_type:form.serviceType,
      notes:form.notes,
      extras:form.extras,
      base_amount:baseAmt,
      extras_amount:extrasTotal,
      total_amount:totalAmt,
      currency:client?.currency||"AUD"
    };
    
    if (horasFueronEditadas) {
      entry.edited_by_user = true;
      entry.edited_at = new Date().toISOString();
      // original_hours: si ya tenía uno guardado, lo mantenemos; si no, usamos las horas que tenía antes
      entry.original_hours = originalEntry.original_hours || originalEntry.hours;
    } else if (!isEdit) {
      entry.edited_by_user = false;
      entry.original_hours = hours;
    }
    
    try {
      if(editId){
        await sb.from("entries").update(entry).eq("id",editId);
        setEntries(entries.map(e=>e.id===editId?{...e,...entry,id:editId}:e));
        showToast(horasFueronEditadas ? "Registro actualizado (editado)" : "Registro actualizado");
        setEditId(null);
      } else {
        const{data}=await sb.from("entries").insert(entry).select().single();
        setEntries([data,...entries]);
        showToast("Registro guardado");
      }
      setForm(initForm);
    } catch(e){showToast("Error guardando","err");console.error(e);}
  };

  const editEntry=e=>{setForm({clientId:e.client_id,date:e.date,startTime:e.start_time,endTime:e.end_time,serviceType:e.service_type,notes:e.notes||"",extras:e.extras||[]});setEditId(e.id);setRegisterMode("manual");setTab(0);window.scrollTo(0,0);};
  const deleteEntry=async id=>{if(!confirm("Eliminar registro?"))return;await sb.from("entries").delete().eq("id",id);setEntries(entries.filter(e=>e.id!==id));showToast("Eliminado");};

  const exportJSON=()=>{const data={clients,entries,archives};const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="timetracker_backup.json";a.click();showToast("Backup exportado");};
  const importJSON=async e=>{const file=e.target.files[0];if(!file)return;try{const text=await file.text();const data=JSON.parse(text);if(data.entries?.length){const mapped=data.entries.map(en=>({client_id:en.clientId||en.client_id,user_name:en.userName||en.user_name||"Royman",date:en.date,start_time:en.startTime||en.start_time,end_time:en.endTime||en.end_time,hours:en.hours,service_type:en.serviceType||en.service_type,notes:en.notes,extras:en.extras||[],base_amount:en.baseAmount||en.base_amount||0,extras_amount:en.extrasAmount||en.extras_amount||0,total_amount:en.totalAmount||en.total_amount||0,currency:en.currency||"AUD"}));await sb.from("entries").insert(mapped);showToast(`${mapped.length} registros importados`);loadData();}}catch(err){showToast("Error al importar","err");}};

  const weeks=useMemo(()=>{const map={};entries.forEach(e=>{const k=weekKey(e.date);if(!map[k])map[k]=[];map[k].push(e);});return Object.entries(map).sort((a,b)=>b[0].localeCompare(a[0]));},[entries]);
  const exportXLSX=(wEntries,label)=>{const rows=wEntries.map(e=>{const c=clients.find(x=>x.id===e.client_id);return{Fecha:fmtDate(e.date),Empleado:e.user_name,Cliente:c?.name||"?",Direccion:c?.address||"",Tipo:e.service_type,Inicio:fmtTime(e.start_time),Fin:fmtTime(e.end_time),Horas:e.hours,Editado:e.edited_by_user?"SI":"NO",HorasOriginal:e.original_hours||e.hours,Tarifa:c?.rate||0,Moneda:e.currency||"AUD",Base:e.base_amount,Extras:e.extras_amount||0,Total:e.total_amount};});const ws=XLSX.utils.json_to_sheet(rows);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Servicios");XLSX.writeFile(wb,`TimeTrack_${label.replace(/[^a-zA-Z0-9]/g,"_")}.xlsx`);};

  const [cForm,setCForm]=useState({name:"",address:"",type:"Residencial",rate:35,currency:"AUD",notes:"",duracion_estimada_horas:1});
  const [cEdit,setCEdit]=useState(null);
  const saveClient=async()=>{
    if(!cForm.name.trim()){showToast("Nombre requerido","err");return;}
    const data={
      ...cForm,
      rate:parseFloat(cForm.rate),
      duracion_estimada_horas:parseInt(cForm.duracion_estimada_horas)||1
    };
    try{
      if(cEdit){
        await sb.from("clients").update(data).eq("id",cEdit);
        setClients(clients.map(c=>c.id===cEdit?{...c,...data}:c));
        setCEdit(null);
        showToast("Cliente actualizado");
      } else {
        const{data:ins}=await sb.from("clients").insert(data).select().single();
        setClients([...clients,ins]);
        showToast("Cliente agregado");
      }
      setCForm({name:"",address:"",type:"Residencial",rate:35,currency:"AUD",notes:"",duracion_estimada_horas:1});
    } catch(e){showToast("Error","err");console.error(e);}
  };
  const editClient=c=>{setCForm({name:c.name,address:c.address||"",type:c.type,rate:c.rate,currency:c.currency||"AUD",notes:c.notes||"",duracion_estimada_horas:c.duracion_estimada_horas||1});setCEdit(c.id);setTab(1);};
  const deleteClient=async id=>{if(!confirm("Eliminar cliente?"))return;await sb.from("clients").delete().eq("id",id);setClients(clients.filter(c=>c.id!==id));showToast("Cliente eliminado");};

  // Cálculos del cronómetro en vivo
  const timerClient = runningTimer ? clients.find(c => c.id === runningTimer.clientId) : null;
  const elapsedSecs = runningTimer ? Math.floor((tickNow - new Date(runningTimer.checkInAt).getTime()) / 1000) : 0;
  const targetSecs = runningTimer ? (runningTimer.duracionEstimadaHoras || 1) * 3600 : 0;
  const remainingSecs = Math.max(0, targetSecs - elapsedSecs);
  const isOvertime = elapsedSecs > targetSecs;

  const s={
    app:{minHeight:"100vh",background:C.bg,color:C.text,paddingBottom:80},
    header:{background:C.card,borderBottom:`1px solid ${C.border}`,padding:"14px 16px",display:"flex",alignItems:"center",gap:10},
    tabBar:{position:"fixed",bottom:0,left:0,right:0,background:C.card,borderTop:`1px solid ${C.border}`,display:"flex",zIndex:100},
    tabBtn:a=>({flex:1,padding:"12px 4px",background:"none",border:"none",color:a?C.accentBright:C.textMuted,fontSize:11,fontFamily:"inherit",fontWeight:a?700:400,cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3}),

    inp:{width:"100%",padding:"10px 12px",background:C.inputBg,border:`1px solid ${C.border}`,borderRadius:8,color:C.text,fontSize:14,fontFamily:"inherit"},
    sel:{width:"100%",padding:"10px 12px",background:C.inputBg,border:`1px solid ${C.border}`,borderRadius:8,color:C.text,fontSize:14,fontFamily:"inherit"},
    btn:{background:C.accentBright,color:"#fff",border:"none",borderRadius:10,padding:"12px 20px",fontFamily:"inherit",fontWeight:700,fontSize:14,cursor:"pointer",width:"100%"},
    btnS:{background:C.inputBg,color:C.textMuted,border:`1px solid ${C.border}`,borderRadius:10,padding:"10px 16px",fontFamily:"inherit",fontWeight:600,fontSize:13,cursor:"pointer"},
    btnBig:{background:C.accentBright,color:"#fff",border:"none",borderRadius:14,padding:"20px",fontFamily:"inherit",fontWeight:800,fontSize:18,cursor:"pointer",width:"100%",boxShadow:"0 4px 12px rgba(196,32,64,0.3)"},
    btnStop:{background:"#80d880",color:"#0a2a10",border:"none",borderRadius:14,padding:"20px",fontFamily:"inherit",fontWeight:800,fontSize:18,cursor:"pointer",width:"100%",boxShadow:"0 4px 12px rgba(128,216,128,0.3)"},
    toast:t=>({position:"fixed",top:16,right:16,left:16,background:t==="err"?"#2a1010":"#0a2a10",border:`1px solid ${t==="err"?"#6b2020":"#206b20"}`,borderRadius:10,padding:"12px 16px",color:t==="err"?"#ff8080":"#80ff80",fontSize:14,fontWeight:500,zIndex:999}),
    row:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10},
    sec:{padding:"0 16px"},
    modal:{position:"fixed",inset:0,background:"rgba(0,0,0,0.8)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200,padding:20},
    mCard:{background:C.card,borderRadius:16,padding:24,width:"100%",maxWidth:340,border:`1px solid ${C.border}`},
    modeToggle:{display:"flex",gap:0,marginBottom:14,background:C.inputBg,borderRadius:10,padding:4,border:`1px solid ${C.border}`},
    modeBtn:a=>({flex:1,padding:"10px",background:a?C.accentBright:"transparent",color:a?"#fff":C.textMuted,border:"none",borderRadius:8,fontFamily:"inherit",fontWeight:700,fontSize:13,cursor:"pointer"}),
  };

  if(loading) return <div style={{...s.app,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16}}><div style={{fontSize:48}}>🧹</div><div style={{color:C.textMuted}}>Cargando...</div></div>;

  return (
    <div style={s.app}>
      {toast&&<div style={s.toast(toast.type)}>{toast.msg}</div>}
      {showModal&&<div style={s.modal}><div style={s.mCard}>
        <div style={{fontSize:28,textAlign:"center",marginBottom:8}}>🧹</div>
        <div style={{fontWeight:700,fontSize:16,textAlign:"center",marginBottom:4}}>Bienvenido</div>
        <div style={{fontSize:13,color:C.textMuted,textAlign:"center",marginBottom:16}}>Como te llamas?</div>
        <input style={{...s.inp,marginBottom:14}} placeholder="Tu nombre" value={tempName} onChange={e=>setTempName(e.target.value)}/>
        <button style={s.btn} onClick={()=>{if(!tempName.trim())return;localStorage.setItem("ssc_username",tempName.trim());setUserName(tempName.trim());setShowModal(false);}}>Entrar</button>
      </div></div>}

      <div style={s.header}>
        <span style={{fontSize:22}}>🧹</span>
        <div style={{flex:1}}>
          <div style={{fontWeight:700,fontSize:16}}>SS Time Tracker</div>
          <div style={{fontSize:11,color:C.textMuted}}>Super Cleaning Services</div>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <span style={{fontSize:12,color:C.textMuted}}>{userName}</span>
          <button onClick={()=>{setTempName(userName);setShowModal(true);}} style={{...s.btnS,padding:"4px 10px",fontSize:11}}>✏️</button>
        </div>
      </div>

      {/* ===== BANNER DE CRONÓMETRO EN CURSO (siempre visible si hay timer) ===== */}
      {runningTimer && tab !== 0 && (
        <div style={{...s.sec,paddingTop:12}}>
          <div onClick={()=>setTab(0)} style={{background:isOvertime?C.warning:C.accentBright,borderRadius:12,padding:"12px 16px",display:"flex",alignItems:"center",gap:12,cursor:"pointer"}} className="pulse">
            <span style={{fontSize:24}}>⏱️</span>
            <div style={{flex:1}}>
              <div style={{fontWeight:700,fontSize:14,color:"#fff"}}>{runningTimer.clientName} en curso</div>
              <div style={{fontSize:12,color:"rgba(255,255,255,0.85)"}}>{fmtElapsed(elapsedSecs)} {isOvertime && "(tiempo excedido)"}</div>
            </div>
            <span style={{color:"#fff",fontSize:18}}>›</span>
          </div>
        </div>
      )}

      {tab===0&&<div style={{...s.sec,paddingTop:16}}>
        
        {/* ===== SECCIÓN CRONÓMETRO EN VIVO (cuando hay timer activo) ===== */}
        {runningTimer && (
          <div style={{...s.card,border:`2px solid ${isOvertime?C.warning:C.accentBright}`}}>
            <div style={{textAlign:"center",marginBottom:12}}>
              <div style={{fontSize:11,color:C.textMuted,letterSpacing:1,fontWeight:600}}>SERVICIO EN CURSO</div>
              <div style={{fontSize:18,fontWeight:700,color:C.accentBright,marginTop:4}}>{runningTimer.clientName}</div>
              {timerClient?.address && <div style={{fontSize:12,color:C.textMuted,marginTop:2}}>{timerClient.address}</div>}
            </div>
            
            <div style={{textAlign:"center",padding:"20px 0",background:C.inputBg,borderRadius:12,marginBottom:14}}>
              <div className={isOvertime?"":"pulse"} style={{fontSize:42,fontWeight:800,fontFamily:"monospace",color:isOvertime?C.warning:C.text,letterSpacing:2}}>
                {fmtElapsed(elapsedSecs)}
              </div>
              <div style={{fontSize:12,color:C.textMuted,marginTop:6}}>
                {isOvertime ? (
                  <span style={{color:C.warning,fontWeight:600}}>⚠️ Excedido por {fmtElapsed(elapsedSecs - targetSecs)}</span>
                ) : (
                  <span>Quedan {fmtElapsed(remainingSecs)} de {runningTimer.duracionEstimadaHoras}h estimadas</span>
                )}
              </div>
            </div>
            
            {timerClient && (
              <div style={{background:C.inputBg,borderRadius:8,padding:"10px 12px",marginBottom:12,fontSize:13}}>
                💵 Tarifa: <b>${timerClient.rate}/h {timerClient.currency}</b> · Inicio: <b>{isoToTime(runningTimer.checkInAt)}</b>
              </div>
            )}
            
            {timerClient?.notes && (
              <div style={{background:"#1a0a0e",border:`1px solid ${C.accentBright}`,borderRadius:8,padding:"10px 12px",marginBottom:12,fontSize:12}}>
                📋 <b>Notas del cliente:</b> {timerClient.notes}
              </div>
            )}
            
            <button onClick={stopTimer} style={s.btnStop}>🏁 Finalizar servicio</button>
            <button onClick={cancelTimer} style={{...s.btnS,width:"100%",marginTop:8,color:"#ff6060"}}>✕ Cancelar (sin guardar)</button>
          </div>
        )}
        
        {/* ===== SI NO HAY TIMER ACTIVO: mostrar inicio o registro manual ===== */}
        {!runningTimer && (
          <>
            <div style={{display:"flex",gap:8,marginBottom:12}}>
              <button onClick={exportJSON} style={{...s.btnS,flex:1,fontSize:12,padding:"8px"}}>📦 Exportar JSON</button>
              <label style={{...s.btnS,flex:1,fontSize:12,padding:"8px",textAlign:"center",cursor:"pointer"}}>📥 Importar JSON<input type="file" accept=".json" onChange={importJSON} style={{display:"none"}}/></label>
            </div>
            
            {/* Toggle entre cronómetro y registro manual */}
            {!editId && (
              <div style={s.modeToggle}>
                <button style={s.modeBtn(registerMode==="timer")} onClick={()=>setRegisterMode("timer")}>⏱️ Cronómetro</button>
                <button style={s.modeBtn(registerMode==="manual")} onClick={()=>setRegisterMode("manual")}>✏️ Manual</button>
              </div>
            )}
            
            {/* MODO CRONÓMETRO: iniciar nuevo servicio */}
            {!editId && registerMode==="timer" && (
              <div style={s.card}>
                <div style={{fontWeight:700,fontSize:15,marginBottom:14,color:C.accentBright}}>▶️ Iniciar servicio</div>
                <label style={s.lbl}>Cliente</label>
                <select style={{...s.sel,marginBottom:12}} value={timerClientId} onChange={e=>setTimerClientId(e.target.value)}>
                  <option value="">Seleccionar cliente...</option>
                  {[...clients].sort((a,b)=>a.name.localeCompare(b.name)).map(c=><option key={c.id} value={c.id}>{c.name} — ${c.rate}/h ({c.duracion_estimada_horas||1}h)</option>)}
                </select>
                
                {timerClientId && (() => {
                  const sel = clients.find(c => c.id === timerClientId);
                  return sel?.notes ? (
                    <div style={{background:"#1a0a0e",border:`1px solid ${C.accentBright}`,borderRadius:8,padding:"10px 12px",marginBottom:12,fontSize:12}}>
                      📋 <b>Notas:</b> {sel.notes}
                    </div>
                  ) : null;
                })()}
                
                <label style={s.lbl}>Notas iniciales (opcional)</label>
                <input style={{...s.inp,marginBottom:14}} placeholder="Algo a tener en cuenta..." value={timerNotes} onChange={e=>setTimerNotes(e.target.value)}/>
                
                <button style={s.btnBig} onClick={startTimer}>▶️ Iniciar servicio</button>
                <div style={{textAlign:"center",fontSize:11,color:C.textMuted,marginTop:8}}>
                  El cronómetro arrancará automáticamente
                </div>
              </div>
            )}
            
            {/* MODO MANUAL o EDICIÓN: formulario tradicional */}
            {(registerMode==="manual" || editId) && (
              <div style={s.card}>
                <div style={{fontWeight:700,fontSize:15,marginBottom:14,color:C.accentBright}}>{editId?"✏️ Editar registro":"✏️ Registro manual"}</div>
                
                {editId && entries.find(e=>e.id===editId)?.edited_by_user && (
                  <div style={{background:"#3a2010",border:`1px solid ${C.warning}`,borderRadius:8,padding:"8px 12px",marginBottom:12,fontSize:12,color:C.warning}}>
                    ⚠️ Este registro ya fue editado anteriormente
                  </div>
                )}
                
                <label style={s.lbl}>Cliente</label>
                <select style={{...s.sel,marginBottom:12}} value={form.clientId} onChange={e=>setForm(f=>({...f,clientId:e.target.value}))}>
                  <option value="">Seleccionar cliente...</option>
                  {[...clients].sort((a,b)=>a.name.localeCompare(b.name)).map(c=><option key={c.id} value={c.id}>{c.name} — ${c.rate}/h</option>)}
                </select>
                {client?.notes&&<div style={{background:"#1a0a0e",border:`1px solid ${C.accentBright}`,borderRadius:8,padding:"10px 12px",marginBottom:12,fontSize:12}}>📋 <b>Notas:</b> {client.notes}</div>}
                <label style={s.lbl}>Fecha</label>
                <input style={{...s.inp,marginBottom:12}} type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/>
                <div style={{...s.row,marginBottom:12}}>
                  <div><label style={s.lbl}>Inicio</label><input style={s.inp} type="time" value={form.startTime} onChange={e=>setForm(f=>({...f,startTime:e.target.value}))}/></div>
                  <div><label style={s.lbl}>Fin</label><input style={s.inp} type="time" value={form.endTime} onChange={e=>setForm(f=>({...f,endTime:e.target.value}))}/></div>
                </div>
                {hours>0&&<div style={{background:C.inputBg,borderRadius:8,padding:"8px 12px",marginBottom:12,fontSize:13}}>⏱ <b>{hours}h</b> · Base: <b>${baseAmt} {client?.currency||"AUD"}</b></div>}
                <label style={s.lbl}>Tipo de servicio</label>
                <select style={{...s.sel,marginBottom:12}} value={form.serviceType} onChange={e=>setForm(f=>({...f,serviceType:e.target.value}))}>{SVC.map(t=><option key={t}>{t}</option>)}</select>
                <label style={s.lbl}>Notas</label>
                <input style={{...s.inp,marginBottom:14}} placeholder="Observaciones..." value={form.notes} onChange={e=>setForm(f=>({...f,notes:e.target.value}))}/>
                <div style={{fontSize:13,fontWeight:600,color:C.textMuted,marginBottom:8}}>Cargos adicionales</div>
                {form.extras.map(x=><div key={x.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:C.inputBg,borderRadius:8,padding:"8px 10px",marginBottom:6,fontSize:13}}><span>{x.desc}</span><span style={{color:C.green}}>${x.amount} <button onClick={()=>removeExtra(x.id)} style={{background:"none",border:"none",color:"#ff6060",cursor:"pointer"}}>✕</button></span></div>)}
                <div style={{display:"flex",gap:8,marginBottom:14}}>
                  <input style={{...s.inp,flex:2}} placeholder="Descripcion" value={extraDesc} onChange={e=>setExtraDesc(e.target.value)}/>
                  <input style={{...s.inp,flex:1}} placeholder="$" type="number" value={extraAmt} onChange={e=>setExtraAmt(e.target.value)}/>
                  <button onClick={addExtra} style={{...s.btnS,padding:"10px 14px"}}>+</button>
                </div>
                {form.extras.length>0&&<div style={{background:C.inputBg,borderRadius:8,padding:"8px 12px",marginBottom:12,fontSize:13}}>💰 Total: <b>${totalAmt} {client?.currency||"AUD"}</b></div>}
                <button style={s.btn} onClick={saveEntry}>{editId?"💾 Actualizar":"✅ Guardar registro"}</button>
                {editId&&<button style={{...s.btnS,width:"100%",marginTop:8}} onClick={()=>{setEditId(null);setForm(initForm);setRegisterMode("timer");}}>Cancelar</button>}
              </div>
            )}
          </>
        )}
        
        {/* Lista de registros recientes */}
        {entries.length>0&&<div style={s.card}>
          <div style={{fontWeight:700,fontSize:14,marginBottom:12,color:C.textMuted}}>Registros ({entries.length})</div>
          {entries.slice(0,20).map(e=>{const c=clients.find(x=>x.id===e.client_id);return(
            <div key={e.id} style={{borderBottom:`1px solid ${C.border}`,paddingBottom:10,marginBottom:10}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                <div>
                  <div style={{fontWeight:600,fontSize:14}}>
                    {c?.name||"?"}
                    {e.edited_by_user && <span style={{fontSize:10,color:C.warning,marginLeft:6,fontWeight:700}}>✎ EDITADO</span>}
                  </div>
                  <div style={{fontSize:12,color:C.textMuted}}>{fmtDateEntry(e)}</div>
                  {e.edited_by_user && e.original_hours && e.original_hours !== e.hours && (
                    <div style={{fontSize:10,color:C.warning,marginTop:2}}>Original: {e.original_hours}h → Ajustado: {e.hours}h</div>
                  )}
                </div>
                <div style={{textAlign:"right"}}><div style={{fontWeight:700,color:C.green}}>${e.total_amount}</div><div style={{display:"flex",gap:6,marginTop:4}}><button onClick={()=>editEntry(e)} style={{...s.btnS,padding:"4px 10px",fontSize:12}}>✏️</button><button onClick={()=>deleteEntry(e.id)} style={{...s.btnS,padding:"4px 10px",fontSize:12,color:"#ff6060"}}>🗑️</button></div></div>
              </div>
            </div>
          );})}
        </div>}
      </div>}

      {tab===1&&<div style={{...s.sec,paddingTop:16}}>
        <div style={s.card}>
          <div style={{fontWeight:700,fontSize:15,marginBottom:14,color:C.accentBright}}>{cEdit?"✏️ Editar":"➕ Nuevo cliente"}</div>
          <label style={s.lbl}>Nombre</label><input style={{...s.inp,marginBottom:10}} value={cForm.name} onChange={e=>setCForm(f=>({...f,name:e.target.value}))} placeholder="Nombre"/>
          <label style={s.lbl}>Direccion</label><input style={{...s.inp,marginBottom:10}} value={cForm.address} onChange={e=>setCForm(f=>({...f,address:e.target.value}))} placeholder="Direccion"/>
          <label style={s.lbl}>Notas del servicio</label><input style={{...s.inp,marginBottom:10}} value={cForm.notes} onChange={e=>setCForm(f=>({...f,notes:e.target.value}))} placeholder="Ej: Tiene perro, 3 habitaciones..."/>
          <div style={{...s.row,marginBottom:10}}>
            <div><label style={s.lbl}>Tipo</label><select style={s.sel} value={cForm.type} onChange={e=>setCForm(f=>({...f,type:e.target.value}))}><option>Residencial</option><option>Comercial</option></select></div>
            <div><label style={s.lbl}>Moneda</label><select style={s.sel} value={cForm.currency} onChange={e=>setCForm(f=>({...f,currency:e.target.value}))}><option>AUD</option><option>USD</option><option>MXN</option></select></div>
          </div>
          <div style={{...s.row,marginBottom:14}}>
            <div><label style={s.lbl}>Tarifa/hora</label><input style={s.inp} type="number" value={cForm.rate} onChange={e=>setCForm(f=>({...f,rate:e.target.value}))}/></div>
            <div>
              <label style={s.lbl}>Duración (h)</label>
              <select style={s.sel} value={cForm.duracion_estimada_horas} onChange={e=>setCForm(f=>({...f,duracion_estimada_horas:e.target.value}))}>
                <option value="1">1 hora</option>
                <option value="2">2 horas</option>
                <option value="3">3 horas</option>
                <option value="4">4 horas</option>
                <option value="5">5 horas</option>
                <option value="6">6 horas</option>
                <option value="8">8 horas</option>
              </select>
            </div>
          </div>
          <button style={s.btn} onClick={saveClient}>{cEdit?"💾 Actualizar":"✅ Agregar"}</button>
          {cEdit&&<button style={{...s.btnS,width:"100%",marginTop:8}} onClick={()=>{setCEdit(null);setCForm({name:"",address:"",type:"Residencial",rate:35,currency:"AUD",notes:"",duracion_estimada_horas:1});}}>Cancelar</button>}
        </div>
        {[...clients].sort((a,b)=>a.name.localeCompare(b.name)).map(c=>(
          <div key={c.id} style={s.card}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div style={{flex:1}}>
                <div style={{fontWeight:600,fontSize:14}}>{c.name}</div>
                <div style={{fontSize:12,color:C.textMuted,marginTop:2}}>{c.address}</div>
                {c.notes&&<div style={{fontSize:11,color:C.accentBright,marginTop:4}}>📋 {c.notes}</div>}
                <div style={{marginTop:4,fontSize:11,color:C.textMuted}}>{c.type} · {c.currency||"AUD"} ${c.rate}/h · ⏱ {c.duracion_estimada_horas||1}h</div>
              </div>
              <div style={{display:"flex",gap:6}}><button onClick={()=>editClient(c)} style={{...s.btnS,padding:"6px 12px"}}>✏️</button><button onClick={()=>deleteClient(c.id)} style={{...s.btnS,padding:"6px 12px",color:"#ff6060"}}>🗑️</button></div>
            </div>
          </div>
        ))}
      </div>}

      {tab===2&&<div style={{...s.sec,paddingTop:16}}>
        {weeks.length===0&&<div style={{textAlign:"center",padding:40,color:C.textMuted}}>No hay registros aun</div>}
        {weeks.map(([key,wEntries])=>{
          const totals={};wEntries.forEach(e=>{const cur=e.currency||"AUD";totals[cur]=(totals[cur]||0)+e.total_amount;});
          return(<div key={key} style={s.card}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}><div style={{fontWeight:700,fontSize:14}}>{weekLabel(key)}</div><button onClick={()=>exportXLSX(wEntries,weekLabel(key))} style={{...s.btnS,padding:"6px 12px",fontSize:12}}>📊 Excel</button></div>
            {wEntries.sort((a,b)=>b.date.localeCompare(a.date)).map(e=>{const c=clients.find(x=>x.id===e.client_id);return(<div key={e.id} style={{borderBottom:`1px solid ${C.border}`,paddingBottom:8,marginBottom:8,fontSize:13}}><div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontWeight:600}}>{c?.name||"?"} {e.edited_by_user&&<span style={{fontSize:9,color:C.warning}}>✎</span>}</span><span style={{color:C.green,fontWeight:700}}>${e.total_amount}</span></div><div style={{color:C.textMuted}}>{fmtDateEntry(e)}</div></div>);})}
            <div style={{borderTop:`1px solid ${C.border}`,paddingTop:8}}>{Object.entries(totals).map(([cur,tot])=><div key={cur} style={{display:"flex",justifyContent:"space-between",fontWeight:700,fontSize:15}}><span>Total {cur}</span><span style={{color:C.accentBright}}>${Math.round(tot*100)/100}</span></div>)}</div>
          </div>);
        })}
      </div>}

      {tab===3&&<div style={{...s.sec,paddingTop:16}}>
        {archives.length===0&&<div style={{textAlign:"center",padding:40,color:C.textMuted}}>No hay semanas archivadas</div>}
        {archives.map(arc=>{
          const ents=arc.entries||[];const totals={};ents.forEach(e=>{const cur=e.currency||"AUD";totals[cur]=(totals[cur]||0)+(e.total_amount||0);});
          return(<div key={arc.id} style={s.card}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}><div style={{fontWeight:700,fontSize:14}}>{arc.label}</div><button onClick={()=>exportXLSX(ents,arc.label)} style={{...s.btnS,padding:"6px 12px",fontSize:12}}>📊 Excel</button></div>
            {ents.map((e,i)=>{const c=clients.find(x=>x.id===e.client_id);return(<div key={i} style={{borderBottom:`1px solid ${C.border}`,paddingBottom:8,marginBottom:8,fontSize:13}}><div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontWeight:600}}>{c?.name||"?"}</span><span style={{color:C.green,fontWeight:700}}>${e.total_amount}</span></div><div style={{color:C.textMuted}}>{fmtDateEntry(e)}</div></div>);})}
            <div style={{borderTop:`1px solid ${C.border}`,paddingTop:8}}>{Object.entries(totals).map(([cur,tot])=><div key={cur} style={{display:"flex",justifyContent:"space-between",fontWeight:700,fontSize:15}}><span>Total {cur}</span><span style={{color:C.accentBright}}>${Math.round(tot*100)/100}</span></div>)}</div>
          </div>);
        })}
      </div>}

      <div style={s.tabBar}>
        {TABS.map((t,i)=><button key={t} style={s.tabBtn(tab===i)} onClick={()=>setTab(i)}><span style={{fontSize:18}}>{ICONS[i]}</span><span>{t}</span></button>)}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
