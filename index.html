// CAPA 3 — MembersSection: nuevo modelo de invitaciones con aprobación
// ═══════════════════════════════════════════════════════════════════════════
function MembersSection({ session, member, household, onShowToast }) {
  const isAdmin = member && member.role === 'admin';
  const householdId = household?.id;

  const { invitation, loading: invLoading, regenerate, revoke } = useActiveInvitation(householdId);
  const { requests, loading: reqLoading, busyId, approve, reject } = useJoinRequests(householdId);

  const [members, setMembers] = useState([]);
  const [busyRegen, setBusyRegen] = useState(false);
  const [busyRevoke, setBusyRevoke] = useState(false);

  // Cargar miembros del hogar
  useEffect(() => {
    if (!householdId) return;
    sb.from('household_members').select('*').eq('household_id', householdId).eq('active', true).then(({ data }) => {
      setMembers(data || []);
    });
  }, [householdId, requests.length]);

  const inviteUrl = invitation ? buildInviteUrl(invitation.token) : '';

  const handleGenerate = async () => {
    setBusyRegen(true);
    const res = await regenerate();
    setBusyRegen(false);
    if (res.error) { onShowToast('✗ ' + res.error, 'danger'); return; }
    onShowToast('✓ Enlace generado');
  };

  const handleRegenerate = async () => {
    if (!confirm('Esto invalidará el enlace actual. ¿Generar uno nuevo?')) return;
    setBusyRegen(true);
    const res = await regenerate();
    setBusyRegen(false);
    if (res.error) { onShowToast('✗ ' + res.error, 'danger'); return; }
    onShowToast('✓ Enlace nuevo creado');
  };

  const handleRevoke = async () => {
    if (!confirm('¿Eliminar el enlace de invitación?')) return;
    setBusyRevoke(true);
    const res = await revoke();
    setBusyRevoke(false);
    if (res?.error) { onShowToast('✗ ' + res.error, 'danger'); return; }
    onShowToast('✓ Enlace eliminado');
  };

  const handleCopy = async () => {
    try {
      await navigator.clipboard.writeText(inviteUrl);
      onShowToast('✓ Enlace copiado');
    } catch (e) {
      // Fallback para WebViews antiguas
      const ta = document.createElement('textarea');
      ta.value = inviteUrl;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); onShowToast('✓ Enlace copiado'); }
      catch (e2) { onShowToast('✗ No se pudo copiar', 'danger'); }
      document.body.removeChild(ta);
    }
  };

  const handleWhatsApp = () => {
    const text = `Te invito a unirte a "${household.name}" en CLP (Calendario de Limpieza Programada).\n\nÁbrelo aquí: ${inviteUrl}\n\nSi no tienes la app, primero inicia sesión en Chrome para que funcione bien.`;
    const wa = `https://wa.me/?text=${encodeURIComponent(text)}`;
    window.open(wa, '_blank');
  };

  const handleApprove = async (reqId) => {
    const res = await approve(reqId);
    if (res.error) onShowToast('✗ ' + res.error, 'danger');
    else onShowToast('✓ Miembro aceptado');
  };

  const handleReject = async (reqId) => {
    if (!confirm('¿Rechazar esta solicitud?')) return;
    const res = await reject(reqId);
    if (res.error) onShowToast('✗ ' + res.error, 'danger');
    else onShowToast('Solicitud rechazada', 'info');
  };

  return (
    <>
      {/* Solicitudes pendientes (solo admin) */}
      {isAdmin && requests.length > 0 && (
        <div className="pr-section">
          <div className="pr-section-title">
            🟡 Solicitudes pendientes
            <span style={{background:'var(--state-pending-bg)', color:'var(--state-pending-text)', fontSize:10, padding:'2px 7px', borderRadius:8, fontFamily:'var(--font-tech)', fontWeight:700, marginLeft:'auto'}}>
              {requests.length}
            </span>
          </div>
          {requests.map(r => {
            const initial = (r.requested_display_name || r.requested_email || '?').trim()[0].toUpperCase();
            return (
              <div key={r.id} className="request-card">
                <div className="rc-head">
                  <div className="rc-avatar">{initial}</div>
                  <div className="rc-body">
                    <div className="rc-name">{r.requested_display_name || 'Sin nombre'}</div>
                    <div className="rc-email">{r.requested_email || '—'}</div>
                  </div>
                </div>
                <div className="rc-meta">Solicitado {formatDateShort(r.created_at)}</div>
                <div className="rc-actions">
                  <button className="rc-btn reject" onClick={() => handleReject(r.id)} disabled={busyId === r.id}>
                    Rechazar
                  </button>
                  <button className="rc-btn approve" onClick={() => handleApprove(r.id)} disabled={busyId === r.id}>
                    {busyId === r.id ? '…' : '✓ Aceptar'}
                  </button>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* Sección miembros */}
      <div className="pr-section">
        <div className="pr-section-title">
          👥 Miembros del hogar
          <span style={{marginLeft:'auto', fontSize:10, color:'var(--text-soft)', fontWeight:500, letterSpacing:0.5}}>{members.length}</span>
        </div>
        {members.map(m => {
          const isYou = m.profile_id === session.user.id;
          return (
            <div key={m.id} className="member-row">
              <div className="avatar-circle" style={{background: m.color || '#1565C0'}}>{(m.short_name || m.display_name || '?')[0]}</div>
              <div className="m-body">
                <div className="m-name">{m.display_name}{isYou && ' (tú)'}</div>
                <div className="m-role">{m.role === 'admin' ? 'Administrador' : 'Miembro'}{m.is_proxy && ' · Proxy'}</div>
              </div>
              {m.role === 'admin' && <div className="m-tag admin">Admin</div>}
            </div>
          );
        })}
      </div>

      {/* Sección enlace de invitación (solo admin) */}
      {isAdmin && (
        <div className="pr-section">
          <div className="pr-section-title">
            🔗 Invitar nuevos miembros
          </div>
          {invLoading ? (
            <div className="empty" style={{padding:'20px'}}>Cargando…</div>
          ) : !invitation ? (
            <div className="invite-link-card no-link">
              <div style={{fontFamily:'var(--font-display)', fontStyle:'italic', fontSize:14, color:'var(--primary-dark)', marginBottom:12}}>
                Aún no hay enlace activo
              </div>
              <button className="invite-btn-big" onClick={handleGenerate} disabled={busyRegen}>
                {busyRegen ? 'Generando…' : '✨ Generar enlace de invitación'}
              </button>
            </div>
          ) : (
            <div className="invite-link-card">
              <div className="ilc-label">Enlace activo</div>
              <div className="ilc-link">{inviteUrl}</div>
              <div className="ilc-meta">Creado {formatDateShort(invitation.created_at)} · Solo un enlace puede estar activo a la vez</div>
              <div className="ilc-actions">
                <button className="ilc-btn primary" onClick={handleCopy}>📋 Copiar</button>
                <button className="ilc-btn primary" onClick={handleWhatsApp} style={{background:'#25D366', borderColor:'#25D366'}}>
                  💬 WhatsApp
                </button>
              </div>
              <div className="ilc-actions" style={{marginTop:6}}>
                <button className="ilc-btn regen" onClick={handleRegenerate} disabled={busyRegen}>
                  {busyRegen ? '…' : '🔄 Regenerar'}
                </button>
                <button className="ilc-btn regen" onClick={handleRevoke} disabled={busyRevoke} style={{color:'var(--danger)', borderColor:'#FFCDD2'}}>
                  {busyRevoke ? '…' : '✕ Eliminar enlace'}
                </button>
              </div>
            </div>
          )}
          <div style={{padding:'10px 22px 0', fontSize:11.5, color:'var(--text-soft)', fontStyle:'italic', fontFamily:'var(--font-display)', textAlign:'center', lineHeight:1.5}}>
            Quienes usen el enlace deberán solicitar unirse. Tú apruebas o rechazas desde aquí.
          </div>
        </div>
      )}
    </>
  );
}

      <MembersSection session={session} member={member} household={household} onShowToast={onShowToast} />

      <div className="pr-section">
        <div className="pr-section-title">⚙️ Preferencias</div>
        <div className="pr-list">
          <div className="pr-row"><div className="pr-ic">🔔</div><div className="pr-body"><div className="pr-label">Notificaciones</div><div className="pr-hint">Recordatorios de tareas</div></div>
            <label className="toggle"><input type="checkbox" defaultChecked /><span className="toggle-slider"></span></label>
          </div>
          <div className="pr-row"><div className="pr-ic">🌙</div><div className="pr-body"><div className="pr-label">Tema oscuro</div><div className="pr-hint">Próximamente</div></div>
            <label className="toggle"><input type="checkbox" disabled /><span className="toggle-slider"></span></label>
          </div>
          <div className="pr-row"><div className="pr-ic">🌍</div><div className="pr-body"><div className="pr-label">Idioma</div></div>
            <div className="pr-right">Español <span className="pr-chev">›</span></div>
          </div>
        </div>
      </div>

      <div className="pr-section">
        <div className="pr-section-title">ℹ️ Sobre la app</div>
        <div className="pr-list">
          <div className="pr-row"><div className="pr-ic">📖</div><div className="pr-body"><div className="pr-label">Cómo usar CLP</div></div><span className="pr-chev">›</span></div>
          <div className="pr-row"><div className="pr-ic">💬</div><div className="pr-body"><div className="pr-label">Enviar feedback</div></div><span className="pr-chev">›</span></div>
        </div>
      </div>

      <div className="pr-section">
        <div className="pr-list">
          <div className="pr-row danger" onClick={handleLogoutClick}>
            <div className="pr-ic">🚪</div>
            <div className="pr-body"><div className="pr-label">Cerrar sesión</div></div>
            <span className="pr-chev">›</span>
          </div>
        </div>
      </div>

      <div className="app-info">
        <div className="version">CLP v1.2 — Capa 3</div>
        <div>South Australia · 2026</div>
      </div>
    </>
  );
}

// ═══════════════════════════════════════════════════════════════════════════
// MODAL — Cambiar de hogar activo (Capa 4 preview, ya funcional)
// ═══════════════════════════════════════════════════════════════════════════
function HouseholdSwitcherModal({ memberships, activeId, onClose, onSwitch }) {
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal-sheet" onClick={e => e.stopPropagation()}>
        <button className="modal-close" onClick={onClose}>✕</button>
        <div className="modal-handle"></div>
        <div className="modal-head"><h2>Tus hogares</h2><div className="sub">Selecciona el activo</div></div>
        <div className="store-selector">
          {memberships.map(m => {
            const isActive = m.household_id === activeId;
            return (
              <div key={m.id} className="ss-row" onClick={() => { onSwitch(m.household_id); onClose(); }} style={isActive ? {borderColor:'var(--primary)', background:'var(--primary-faint)'} : {}}>
                <div className="store-logo" style={{background:'var(--primary-faint)', color:'var(--primary-dark)'}}>🏡</div>
                <div style={{flex:1, minWidth:0}}>
                  <div style={{fontWeight:600, fontSize:14, color:'var(--text)'}}>{m.households?.name || 'Sin nombre'}</div>
                  <div style={{fontSize:11.5, color:'var(--text-soft)'}}>{m.role === 'admin' ? 'Admin' : 'Miembro'}</div>
                </div>
                {isActive && <span style={{color:'var(--primary-dark)', fontSize:18, fontWeight:700}}>✓</span>}
              </div>
            );
          })}
        </div>
        <div style={{padding:'14px 22px 0', fontSize:11.5, color:'var(--text-soft)', fontStyle:'italic', fontFamily:'var(--font-display)', textAlign:'center'}}>
          El hogar activo determina qué tareas, despensa y compras verás.
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════════
// MAIN APP — orquesta secciones (con badge de solicitudes pendientes)
// ═══════════════════════════════════════════════════════════════════════════
const SECTIONS = [
  { id: 'home', icon: '🏠', label: 'Inicio' },
  { id: 'tasks', icon: '📋', label: 'Tareas' },
  { id: 'shopping', icon: '🛒', label: 'Compras' },
  { id: 'balance', icon: '⚖️', label: 'Balance' },
  { id: 'library', icon: '📚', label: 'Biblioteca' },
  { id: 'profile', icon: '👤', label: 'Perfil' },
];

function MainApp({ session, member, household, memberships, onLogout, onSwitchHousehold }) {
  const [section, setSection] = useState('home');
  const [openTask, setOpenTask] = useState(null);
  const [openArticle, setOpenArticle] = useState(null);
  const [shopView, setShopView] = useState('hub');
  const [activeStore, setActiveStore] = useState(null);
  const [activeHistory, setActiveHistory] = useState(null);
  const [stores, setStores] = useState(INITIAL_STORES);
  const [storeLists, setStoreLists] = useState(INITIAL_STORE_LISTS);
  const [history, setHistory] = useState(INITIAL_HISTORY);
  const [showScanner, setShowScanner] = useState(false);
  const [showAdd, setShowAdd] = useState(false);
  const [editingPrice, setEditingPrice] = useState(null);
  const [toast, setToast] = useState(null);
  const [showHouseholdSwitcher, setShowHouseholdSwitcher] = useState(false);

  // Contador de solicitudes pendientes para el badge del nav
  const { requests: pendingRequests } = useJoinRequests(member?.role === 'admin' ? household?.id : null);
  const pendingCount = pendingRequests.length;

  const showToast = useCallback((message, variant = 'success') => {
    setToast({ message, variant });
    setTimeout(() => setToast(null), 2500);
  }, []);

  // Compras handlers (sin cambios)
  const handleTickProduct = (productId) => setStoreLists(prev => ({...prev, [activeStore.id]: prev[activeStore.id].filter(p => p.id !== productId)}));
  const handleEditPrice = (price) => { if (!editingPrice) return; setStoreLists(prev => ({...prev, [activeStore.id]: prev[activeStore.id].map(p => p.id === editingPrice.id ? {...p, price} : p)})); setEditingPrice(null); };
  const handleDeleteProduct = (productId) => setStoreLists(prev => ({...prev, [activeStore.id]: prev[activeStore.id].filter(p => p.id !== productId)}));
  const handleAddProduct = ({ name, price }) => { const newProduct = { id: `p${Date.now()}`, name, price }; setStoreLists(prev => ({...prev, [activeStore.id]: [...(prev[activeStore.id] || []), newProduct]})); setShowAdd(false); };
  const handleProductScanned = (scannedProduct, storeId) => { const newProduct = { id: `s${Date.now()}`, name: scannedProduct.name, price: scannedProduct.price }; setStoreLists(prev => ({...prev, [storeId]: [...(prev[storeId] || []), newProduct]})); setShowScanner(false); showToast(`✓ Agregado a ${stores.find(s => s.id === storeId)?.name}`); };
  const handleArchiveCompra = () => { const list = storeLists[activeStore.id], total = list.reduce((s, p) => s + p.price, 0); const newRecord = { id: `arc${Date.now()}`, storeId: activeStore.id, date: 'hoy', items: list.length, total, hasTicket: false }; setHistory(prev => [newRecord, ...prev]); setStoreLists(prev => ({...prev, [activeStore.id]: []})); setShopView('hub'); setActiveStore(null); };

  // Render por sección
  let content;
  if (section === 'home' && openTask) content = <TaskDetailScreen task={openTask} onBack={() => setOpenTask(null)} />;
  else if (section === 'home') content = <HomeScreen onOpenTask={setOpenTask} member={member} household={household} />;
  else if (section === 'tasks' && openTask) content = <TaskDetailScreen task={openTask} onBack={() => setOpenTask(null)} />;
  else if (section === 'tasks') content = <TasksScreen onOpenTask={setOpenTask} />;
  else if (section === 'shopping' && shopView === 'list' && activeStore) content = <StoreListScreen store={activeStore} list={storeLists[activeStore.id] || []} onBack={() => { setShopView('hub'); setActiveStore(null); }} onTickProduct={handleTickProduct} onEditPrice={setEditingPrice} onDeleteProduct={handleDeleteProduct} onAddManual={() => setShowAdd(true)} onCloseCompra={() => setShopView('close')} />;
  else if (section === 'shopping' && shopView === 'close' && activeStore) content = <CloseCompraScreen store={activeStore} list={storeLists[activeStore.id] || []} onBack={() => setShopView('list')} onArchive={handleArchiveCompra} />;
  else if (section === 'shopping') content = <ShoppingScreen stores={stores} storeLists={storeLists} history={history} householdId={household?.id} onOpenStore={(s) => { setActiveStore(s); setShopView('list'); }} onOpenHistory={setActiveHistory} onOpenScanner={() => setShowScanner(true)} />;
  else if (section === 'balance') content = <BalanceScreen />;
  else if (section === 'library' && openArticle) content = <ArticleScreen article={openArticle} onBack={() => setOpenArticle(null)} />;
  else if (section === 'library') content = <LibraryScreen onOpenArticle={setOpenArticle} />;
  else if (section === 'profile') content = <ProfileScreen session={session} member={member} household={household} memberships={memberships} onLogout={onLogout} onShowToast={showToast} onSwitchHousehold={() => memberships.length > 1 ? setShowHouseholdSwitcher(true) : null} />;

  return (
    <>
      <div className="main">{content}</div>
      <div className="nav">
        {SECTIONS.map(s => (
          <button key={s.id} className={'nav-item' + (section === s.id ? ' active' : '')} onClick={() => { setSection(s.id); setOpenTask(null); setOpenArticle(null); setShopView('hub'); setActiveStore(null); }}>
            <span className="icon">{s.icon}</span>
            <span className="label">{s.label}</span>
            {s.id === 'profile' && pendingCount > 0 && <span className="nav-badge">{pendingCount}</span>}
          </button>
        ))}
      </div>
      {showScanner && <ScannerModal stores={stores} onClose={() => setShowScanner(false)} onProductScanned={handleProductScanned} />}
      {showAdd && activeStore && <AddProductModal onClose={() => setShowAdd(false)} onAdd={handleAddProduct} subtitle={`Para ${activeStore.name}`} />}
      {editingPrice && <EditPriceModal product={editingPrice} onClose={() => setEditingPrice(null)} onSave={handleEditPrice} />}
      {showHouseholdSwitcher && <HouseholdSwitcherModal memberships={memberships} activeId={household?.id} onClose={() => setShowHouseholdSwitcher(false)} onSwitch={onSwitchHousehold} />}
      {toast && <div className={'copied-toast' + (toast.variant === 'danger' ? ' danger' : toast.variant === 'info' ? ' info' : '')}>{toast.message}</div>}
    </>
  );
}

// ═══════════════════════════════════════════════════════════════════════════
// ROOT — orquesta auth, hogares, invitaciones pendientes, onboarding
// ═══════════════════════════════════════════════════════════════════════════
function Root() {
  const { session, loading: sessionLoading } = useSession();
  const { memberships, loading: hhLoading, reload: reloadHouseholds } = useHouseholds(session);
  const { household, member, activeHouseholdId, switchHousehold } = useActiveHousehold(memberships);
  const { myRequests, loading: reqLoading, cancel: cancelMyRequest, reload: reloadMyRequests } = useMyPendingRequests(session);

  const [pendingInviteToken, setPendingInviteTokenState] = useState(getPendingInviteToken);
  const [showInviteModal, setShowInviteModal] = useState(false);
  const [waitingRequest, setWaitingRequest] = useState(null); // { request_id, household_name, household_id }
  const [busy, setBusy] = useState(false);
  const [globalToast, setGlobalToast] = useState(null);
  const [hideWaitingFor, setHideWaitingFor] = useState(null); // request_id que el usuario eligió "Continuar con mi hogar"

  const showToast = useCallback((message, variant = 'success') => {
    setGlobalToast({ message, variant });
    setTimeout(() => setGlobalToast(null), 2500);
  }, []);

  // Cuando hay sesión Y hay token pendiente Y no estamos ya mostrando modal/waiting
  useEffect(() => {
    if (!session) return;
    if (sessionLoading || hhLoading) return;
    const token = getPendingInviteToken();
    if (token && !showInviteModal && !waitingRequest) {
      setPendingInviteTokenState(token);
      setShowInviteModal(true);
    }
  }, [session, sessionLoading, hhLoading]);

  // Manejador cuando el invitado decide si solicita o no
  const handleInviteRequested = (result) => {
    if (result.alreadyMember) {
      // Ya era miembro: recargar memberships y entrar
      reloadHouseholds();
      showToast('✓ Bienvenido de vuelta', 'success');
      return;
    }
    // Se creó la solicitud
    if (memberships.length === 0) {
      // No tiene ningún hogar todavía → mostrar pantalla de espera
      setWaitingRequest({
        request_id: result.request_id,
        household_name: result.household_name,
        household_id: result.household_id,
      });
    } else {
      // Ya tiene hogar(es) → mostrar toast y seguir
      showToast('✓ Solicitud enviada. Te avisaremos.', 'success');
      reloadMyRequests();
    }
  };

  const handleRefreshWaiting = async () => {
    setBusy(true);
    await reloadMyRequests();
    await reloadHouseholds();
    setBusy(false);
    // Si la solicitud ya no está pendiente y aparece como aprobada, el hogar habrá aparecido en memberships
    // El efecto de abajo lo detectará y limpiará waitingRequest
  };

  // Si la solicitud se aprobó, el nuevo hogar aparece en memberships → salir de waiting
  useEffect(() => {
    if (!waitingRequest) return;
    const joined = memberships.some(m => m.household_id === waitingRequest.household_id);
    if (joined) {
      setActiveHouseholdId(waitingRequest.household_id);
      switchHousehold(waitingRequest.household_id);
      setWaitingRequest(null);
      showToast('🎉 Tu solicitud fue aprobada', 'success');
    }
  }, [memberships, waitingRequest]);

  const handleCancelWaiting = async () => {
    if (!waitingRequest) return;
    if (!confirm('¿Cancelar tu solicitud?')) return;
    setBusy(true);
    const res = await cancelMyRequest(waitingRequest.request_id);
    setBusy(false);
    if (res.error) { showToast('✗ ' + res.error, 'danger'); return; }
    setWaitingRequest(null);
    showToast('Solicitud cancelada', 'info');
  };

  const handleContinueFromWaiting = () => {
    // El usuario tiene hogares previos y quiere ignorar el waiting por ahora
    if (waitingRequest) setHideWaitingFor(waitingRequest.request_id);
    setWaitingRequest(null);
  };

  const { create: createHousehold } = useCreateHousehold(session, (newId) => {
    setActiveHouseholdId(newId);
    switchHousehold(newId);
    reloadHouseholds();
  });

  const handleLogout = () => {
    clearActiveHouseholdId();
    clearPendingInviteToken();
    setPendingInviteTokenState(null);
    setWaitingRequest(null);
    setShowInviteModal(false);
  };

  // ─── ESTADOS DE RENDERIZADO ──────────────────────────────────────────────

  // 1) Cargando sesión
  if (sessionLoading) return <FullLoader msg="Iniciando…" />;

  // 2) Sin sesión → Login (mostrar banner si hay invite pendiente)
  if (!session) return <LoginScreen pendingInvite={pendingInviteToken} />;

  // 3) Sesión cargada pero memberships aún cargando
  if (hhLoading || reqLoading) return <FullLoader msg="Cargando tu hogar…" />;

  // 4) Si hay modal de invite por mostrar → mostrarlo primero (sobre el resto)
  // FIX (Capa 3): si el invitado NO tiene hogares previos, NO renderizamos full-loader detrás
  // porque su z-index alto (300) tapaba al modal-backdrop (100). El modal del invite ya cubre
  // toda la pantalla con su propio backdrop, así que un fondo extra es innecesario.
  if (showInviteModal && pendingInviteToken) {
    return (
      <>
        {/* Solo renderizar MainApp como fondo si ya tiene hogares; si no, dejar el modal solo */}
        {memberships.length > 0 && household && (
          <MainApp session={session} member={member} household={household} memberships={memberships} onLogout={handleLogout} onSwitchHousehold={switchHousehold} />
        )}
        <InviteIncomingModal
          token={pendingInviteToken}
          onClose={() => { setShowInviteModal(false); setPendingInviteTokenState(null); }}
          onRequested={handleInviteRequested}
          onShowToast={showToast}
        />
        {globalToast && <div className={'copied-toast' + (globalToast.variant === 'danger' ? ' danger' : globalToast.variant === 'info' ? ' info' : '')}>{globalToast.message}</div>}
      </>
    );
  }

  // 5) Pantalla de espera (cuando la persona solo tiene una solicitud pendiente, sin hogar)
  if (waitingRequest && memberships.length === 0) {
    return (
      <>
        <WaitingApprovalScreen
          request={waitingRequest}
          onRefresh={handleRefreshWaiting}
          onCancel={handleCancelWaiting}
          onContinue={null}
          busy={busy}
        />
        {globalToast && <div className={'copied-toast' + (globalToast.variant === 'danger' ? ' danger' : globalToast.variant === 'info' ? ' info' : '')}>{globalToast.message}</div>}
      </>
    );
  }

  // 6) Sin hogares Y sin solicitud pendiente → Onboarding
  if (memberships.length === 0) {
    // Pero: ¿tiene una solicitud pendiente automática que aún no procesamos?
    const autoPending = myRequests.find(r => r.id !== hideWaitingFor);
    if (autoPending) {
      // Mostrar waiting con la solicitud que ya tenía
      return (
        <>
          <WaitingApprovalScreen
            request={{ request_id: autoPending.id, household_name: autoPending.households?.name, household_id: autoPending.household_id }}
            onRefresh={handleRefreshWaiting}
            onCancel={async () => {
              if (!confirm('¿Cancelar tu solicitud?')) return;
              setBusy(true);
              const res = await cancelMyRequest(autoPending.id);
              setBusy(false);
              if (res.error) showToast('✗ ' + res.error, 'danger');
            }}
            onContinue={null}
            busy={busy}
          />
          {globalToast && <div className={'copied-toast' + (globalToast.variant === 'danger' ? ' danger' : globalToast.variant === 'info' ? ' info' : '')}>{globalToast.message}</div>}
        </>
      );
    }
    return (
      <>
        <OnboardingModal session={session} onCreate={createHousehold} />
        {globalToast && <div className={'copied-toast' + (globalToast.variant === 'danger' ? ' danger' : globalToast.variant === 'info' ? ' info' : '')}>{globalToast.message}</div>}
      </>
    );
  }

  // 7) Caso normal: tiene hogar(es) → MainApp
  if (!household || !member) return <FullLoader msg="Preparando tu hogar…" />;

  return (
    <>
      <MainApp
        session={session}
        member={member}
        household={household}
        memberships={memberships}
        onLogout={handleLogout}
        onSwitchHousehold={switchHousehold}
      />
      {globalToast && <div className={'copied-toast' + (globalToast.variant === 'danger' ? ' danger' : globalToast.variant === 'info' ? ' info' : '')}>{globalToast.message}</div>}
    </>
  );
}

// ═══════════════════════════════════════════════════════════════════════════
// MOUNT
// ═══════════════════════════════════════════════════════════════════════════
ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
